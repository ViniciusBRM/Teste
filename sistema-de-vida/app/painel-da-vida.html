<title>Painel da Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra lateral de navegação por área da vida + área de trabalho em grade; no celular a navegação vira faixa rolável no topo */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#dde2ea; --ink:#141a24; --ink-2:#4b5566; --muted:#7a8496;
  --nav:#141a24; --nav-ink:#c9d1de; --nav-active:#ffffff;
  --plan:#2a78d6; --money:#14a072; --body:#e2612d; --grow:#5b4bc4; --people:#d4588a; --home:#c98a00; --sys:#7a8496;
  --good:#16833a; --good-bg:#e2f3e7; --warn:#946200; --warn-bg:#fdf1d3; --crit:#c0392b; --crit-bg:#fbe3e0;
  --div-lo:#e86a5f; --div-mid:#e4e1da; --div-hi:#2a78d6;
  --seq-0:#dbe8fa; --seq-1:#1c5cab;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body-f:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --surface-2:#1e2430; --line:#2a3240; --ink:#e9edf3; --ink-2:#aeb7c6; --muted:#7f8899;
  --nav:#0a0d12; --nav-ink:#9aa4b5; --nav-active:#ffffff;
  --plan:#4b92ea; --money:#2bbd8a; --body:#f07a49; --grow:#8b7ef0; --people:#e77aa6; --home:#e0a21c; --sys:#8a93a4;
  --good:#3fc06a; --good-bg:#16301f; --warn:#e8b23a; --warn-bg:#33290f; --crit:#f07062; --crit-bg:#3a1c19;
  --div-mid:#3a404c; --seq-0:#1f3350; --seq-1:#6aa8f5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --surface-2:#1e2430; --line:#2a3240; --ink:#e9edf3; --ink-2:#aeb7c6; --muted:#7f8899;
  --nav:#0a0d12; --nav-ink:#9aa4b5; --nav-active:#ffffff;
  --plan:#4b92ea; --money:#2bbd8a; --body:#f07a49; --grow:#8b7ef0; --people:#e77aa6; --home:#e0a21c; --sys:#8a93a4;
  --good:#3fc06a; --good-bg:#16301f; --warn:#e8b23a; --warn-bg:#33290f; --crit:#f07062; --crit-bg:#3a1c19;
  --div-mid:#3a404c; --seq-0:#1f3350; --seq-1:#6aa8f5; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body-f);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.side{background:var(--nav);color:var(--nav-ink);padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--nav-active);padding:4px 10px 16px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body-f);font-weight:500;font-size:11px;color:var(--nav-ink);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.navgroup{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--nav-ink);text-decoration:none;font-weight:500}
nav.side a .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--sys));flex:none}
nav.side a:hover{background:rgba(255,255,255,.06);color:var(--nav-active)}
nav.side a[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--nav-active)}
nav.side a:focus-visible{outline:2px solid var(--plan);outline-offset:1px}
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.monthpick button{border:0;background:none;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:16px}
.monthpick button:hover{background:var(--surface-2)}
.monthpick span{min-width:128px;text-align:center;font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:10px 14px;border-radius:var(--r);margin-bottom:18px}
.banner b{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--plan);outline-offset:1px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h2 small{font-family:var(--body-f);font-weight:500;font-size:12px;color:var(--muted)}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px;border-top:3px solid var(--c,var(--sys));min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v.sm{font-size:16px;line-height:1.3;font-family:var(--body-f)}
.kpi .s{font-size:12px;color:var(--ink-2)}
.st-good{color:var(--good)} .st-warn{color:var(--warn)} .st-crit{color:var(--crit)} .st-none{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.none{background:var(--surface-2);color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:14px;margin-bottom:4px}
.index{background:var(--nav);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0}
.index .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.index .big small{font-size:20px;color:#9aa4b5;letter-spacing:0}
.index .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9aa4b5;font-weight:700}
.index .cmp{font-size:13px;color:#d4dae4}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c,var(--plan))}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.areabar{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.li .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.strip{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px}
.strip div{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.strip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
svg text{font-family:var(--body-f)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.reflect{font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.reflect.ph{color:var(--muted);font-style:italic}
.prio{display:flex;flex-direction:column;gap:6px}
.prio label{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:6px;font-family:var(--mono);color:var(--plan);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:70px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.hgrid{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(14,minmax(22px,1fr)) 64px;gap:4px;align-items:center;font-size:12px;min-width:620px}
.hgrid .hd{font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--mono)}
.hgrid .hd.today{color:var(--ink);font-weight:700}
.tick{aspect-ratio:1;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;width:100%}
.tick.on{background:var(--body);border-color:var(--body)}
.tick:hover{border-color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
.range{display:grid;grid-template-columns:minmax(0,1fr) 140px 36px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.range output{font-family:var(--mono);font-weight:600;text-align:right}
input[type=range]{width:100%;accent-color:var(--plan)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,13,18,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:14px}
dialog h3{font-family:var(--display);margin:0;font-size:18px}
.dlgfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:50}
.saving{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;z-index:5;gap:4px}
  .brand,.navgroup{display:none}
  nav.side a{white-space:nowrap;padding:6px 10px}
  main{padding-inline:16px}
  .g3,.g2{grid-template-columns:1fr}.span2{grid-column:auto}
}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}.index .big{font-size:52px}.range{grid-template-columns:1fr 100px 30px}}
@media (prefers-reduced-motion:no-preference){.kpi,.panel{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

/* ---------- camada analítica (estilo BI) ---------- */
:root{--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--shadow-h:0 2px 4px rgba(16,24,40,.08),0 10px 28px rgba(16,24,40,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);--shadow-h:0 2px 6px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);--shadow-h:0 2px 6px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.35)}
main{max-width:1640px}
.panel,.kpi,.tile,.kc{box-shadow:var(--shadow);border:1px solid var(--line);transition:box-shadow .18s ease,transform .18s ease}
.tile:hover,.kc:hover{box-shadow:var(--shadow-h)}
.panel{border-radius:14px}.kpi{border-radius:12px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0 12px;margin:-6px 0 10px}
.fgrp{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.flbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px}
.fgrp select{border:0;width:auto;padding:5px 8px;background:transparent;font-weight:600}
.fnote{font-size:12px;color:var(--muted)}
.seg{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:background .15s}
.seg:hover{background:var(--surface-2)}
.seg[aria-pressed="true"],.seg[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.kgrid{display:grid;grid-template-columns:1.25fr repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kc{background:var(--surface);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;min-width:0}
.kc::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.kc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kc .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tgt{font-size:11px;color:var(--muted);font-family:var(--mono)}
.kc-b{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}.kc-b .spark{width:100%;height:30px}
.kc .v{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kc .v small{font-size:15px;color:var(--muted);font-weight:600}
.kc .v.xl{font-size:44px}
.kc.khero{grid-row:span 2;background:linear-gradient(160deg,color-mix(in srgb,var(--plan) 14%,var(--surface)),var(--surface) 60%)}
.kc.khero .kc-b{grid-template-columns:1fr;align-items:start}.kc.khero .spark{width:100%;height:80px;margin-top:10px}
.kc-s{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.spark{width:120px;height:34px;display:block}
.dl{display:inline-block;font-size:11.5px;font-weight:700;margin-top:4px;font-family:var(--mono)}
.dl em{font-style:normal;font-weight:500;color:var(--muted);font-family:var(--body-f)}
.dl.good{color:var(--good)}.dl.crit{color:var(--crit)}.dl.none{color:var(--muted);font-weight:500;font-family:var(--body-f)}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:14px;padding:16px 18px;min-width:0}
.tile header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tile h2{font-family:var(--display);font-weight:700;font-size:15.5px;margin:0;letter-spacing:-.01em}
.tile h2 small{font-family:var(--body-f);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.small{font-size:12px;margin-top:6px}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);padding:3px 8px;border-radius:6px}
.legend-inline{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.legend-inline i{width:14px;height:8px;border-radius:2px;display:inline-block;margin-left:6px}
.heat{display:grid;gap:3px;align-items:stretch;overflow-x:auto}
.hh{font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--mono);padding-bottom:2px}
.hr{border:0;background:none;text-align:left;font-weight:600;font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr:hover{background:var(--surface-2)}.hr.sel{background:var(--ink);color:var(--surface)}
.hc{border-radius:5px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;min-height:26px;color:var(--ink);transition:transform .12s}
.hc:hover{transform:scale(1.08)}
.focus{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.insights{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--plan) 4%,var(--surface)))}
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.in{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);border-left:4px solid var(--muted)}
.in.good{border-left-color:var(--good)}.in.warn{border-left-color:var(--warn)}.in.crit{border-left-color:var(--crit)}
.ik{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.in p{margin:6px 0;font-size:13.5px}.in p b{font-family:var(--mono);font-weight:600}
.ia{font-size:12.5px;color:var(--ink-2)}
.donutwrap{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:14px}
.donut{width:150px;height:150px}
.donut path{transition:opacity .15s}.donut path:hover{opacity:.8}
.dleg{display:flex;flex-direction:column;gap:7px;font-size:13px}
.dleg div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}.dleg i{width:10px;height:10px;border-radius:3px}.dleg b{font-family:var(--mono);font-weight:600}
.bud{display:flex;flex-direction:column;gap:9px}

<script>
"use strict";
/* ============================================================ utilidades */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const TODAY = iso(new Date());
const mkey = s => s.slice(0, 7);
const addMonth = (mk, n) => { const d = parse(mk + "-01"); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const dim = mk => { const d = parse(mk + "-01"); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const mlabel = mk => `${MESES[+mk.slice(5) - 1]} ${mk.slice(0, 4)}`;
const mabbr = mk => MESES[+mk.slice(5) - 1].slice(0, 3);
const fmtD = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "";
const eur = (v, d = 0) => (v < 0 ? "−" : "") + "€ " + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const num = (v, d = 1) => v == null || isNaN(v) ? "–" : v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => v == null || isNaN(v) ? "–" : Math.round(v * 100) + "%";
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const pill = (st, txt) => `<span class="pill ${st}">${{ good: "✓", warn: "▲", crit: "✕", none: "○" }[st]} ${esc(txt)}</span>`;

const AREAS = ["Saúde física","Saúde mental","Finanças","Carreira","Aprendizado","Família","Amor & parceria","Amizades & social","Lazer & criatividade","Propósito & espiritualidade","Casa & organização"];
const CAT_DESP = { "Moradia":"Essencial","Contas da casa":"Essencial","Mercado":"Essencial","Transporte":"Essencial","Saúde & bem-estar":"Essencial","Dívidas & financiamentos":"Essencial","Impostos & taxas":"Essencial","Família & ajudas":"Essencial","Restaurantes & cafés":"Estilo de vida","Assinaturas":"Estilo de vida","Cuidados pessoais":"Estilo de vida","Lazer & passeios":"Estilo de vida","Viagens":"Estilo de vida","Roupas":"Estilo de vida","Casa & utensílios":"Estilo de vida","Presentes & doações":"Estilo de vida","Educação & cursos":"Crescimento","Livros & materiais":"Crescimento","Outros":"Estilo de vida" };
const CAT_REC = ["Salário","Renda extra / freelance","Benefícios","Rendimentos","Reembolsos","Outras receitas"];
const CAT_APO = ["Reserva de emergência","Investimentos","Previdência","Objetivo específico"];
const CONTAS = ["Conta corrente","Cartão de crédito","Cartão de débito","PIX / transferência","Dinheiro"];
const TREINOS = ["Musculação","Corrida","Caminhada","Bicicleta","Natação","Yoga / alongamento","Esporte coletivo","Outro"];
const RELACAO = ["Família","Parceria","Amizade","Trabalho","Mentoria","Comunidade"];

/* ============================================================ estado */
const KEYS = ["cfg","lanc","orc","patr","saude","habitos","marks","roda","alvo","revisao","metas","tarefas","pessoas","contatos","aprend","estudo","lazer","sonhos","docs","rotinas","assin","comp","cand","prio"];
const EMPTY = () => ({
  cfg: { nome: "", metaPoup: .2, metaReserva: 6, metaSono: 7.5, metaTreinos: 4, metaPassos: 8000, metaEstudo: 24, metaLivros: 12, metaLazer: 6, alertaDocs: 90, alertaAniv: 30 },
  lanc: [], orc: {}, patr: {}, saude: {}, habitos: [], marks: {}, roda: {}, alvo: {}, revisao: {}, metas: [], tarefas: [],
  pessoas: [], contatos: [], aprend: [], estudo: [], lazer: [], sonhos: [], docs: [], rotinas: [], assin: [], comp: [], cand: [], prio: ["", "", ""]
});
let S = EMPTY(), REF = mkey(TODAY), IS_EXAMPLE = true, STORE = null, LOADED = false;
const dirty = new Set(); let saveTimer = null;

function touch(...keys) {
  MEMO = null;
  if (IS_EXAMPLE) { IS_EXAMPLE = false; KEYS.forEach(k => dirty.add(k)); } else keys.forEach(k => dirty.add(k));
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); render();
}
async function flush() {
  const keys = [...dirty]; dirty.clear();
  if (!keys.length) return;
  try {
    if (STORE?.kind === "db") { for (const k of keys) await STORE.col.doc("s_" + k).set({ v: S[k], at: Date.now() }); }
    else { for (const k of keys) try { localStorage.setItem("pv_" + k, JSON.stringify(S[k])); } catch {} }
    toast("Salvo");
  } catch (e) { keys.forEach(k => dirty.add(k)); toast("Não foi possível salvar agora. Tentando de novo em instantes."); saveTimer = setTimeout(flush, 5000); }
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1600); }

/* ============================================================ dados de exemplo (fictícios) */
function exampleData() {
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(R() * a.length)];
  const D = EMPTY(); D.cfg.nome = "";
  const start = addDays(TODAY, -240), end = addDays(TODAY, -1);

/* ============================================================ motor de cálculo (mesmas regras da planilha) */
function calc() {

  const daysYear = corte ? diff(corte, yIni) + 1 : 0;

  const F = R.fin = byM(mk);
  R.series = []; for (let k = 11; k >= 0; k--) { const m = addMonth(mk, -k); const o = byM(m); o.mk = m; R.series.push(o); }

  R.orcTot = orcTot;
  const ritmo = DR / dim(mk);
  R.orcCats = Object.keys(CAT_DESP).map(c => { const real = F.cat[c] || 0, plan = +S.orc[c] || 0; const p = plan ? real / plan : null;
    const st = plan ? (p > 1 ? "crit" : p > ritmo + .15 ? "warn" : "good") : (real ? "none" : null);
    return { cat: c, grupo: CAT_DESP[c], real, plan, p, st }; }).filter(x => x.real || x.plan);
  const pk = Object.keys(S.patr).filter(k => k <= mk).sort();
  const pl = k => { const p = S.patr[k]; return (+p.contas || 0) + (+p.reserva || 0) + (+p.invest || 0) + (+p.outros || 0) - (+p.dividas || 0); };
  R.pl = pk.length ? pl(pk.at(-1)) : null; R.plVar = pk.length > 1 ? pl(pk.at(-1)) - pl(pk.at(-2)) : null; R.plMes = pk.at(-1);

  R.sono = av("sono"); R.humor = av("humor"); R.energia = av("energia"); R.estresse = av("estresse"); R.passos = av("passos");

          ${habs.length ? `<div class="tablewrap"><div class="cal" style="grid-template-columns:minmax(110px,1.4fr) repeat(${dm},minmax(9px,1fr)) 46px">${habs.map(h => `<div class="cn">${esc(h.nome)}</div>${mdays.map(d => `<div class="cd ${S.marks[h.id + "|" + d] ? "on" : d > TODAY ? "fut" : ""}" ${tip(`${h.nome} · ${fmtD(d)}`)}></div>`).join("")}<div class="cp ${h.st}">${pct(h.pm)}</div>`).join("")}</div></div>` : `<div class="empty">Nenhum hábito.</div>`}</section>
        <section class="np a-sau"><header><h2>Saúde do mês</h2></header>
          <div class="minikpi"><div><span>Sono</span><b>${R.sono == null ? "–" : num(R.sono) + " h"}</b>${delta(R.sono, P?.sono, { unit: " h" })}</div><div><span>Humor</span><b>${R.humor == null ? "–" : num(R.humor)}</b>${delta(R.humor, P?.humor)}</div><div><span>Treinos</span><b>${R.treinos}</b>${delta(R.treinos, P?.treinos, { fmt: v => num(v, 0) })}</div><div><span>Estudo</span><b>${num(R.horasEst)} h</b>${delta(R.horasEst, P?.horasEst, { unit: " h" })}</div></div>
          <div class="mt" style="margin-top:10px">Humor · 28 dias</div>${strip(R.days28, "humor", "div")}</section>
        <section class="np a-fila"><header><h2>Fila de ação</h2></header><div class="list">
          ${[...R.tar.filter(t => t.open && t.st !== "none" && fA(t.area)).sort((a, b) => (a.prazo || "9").localeCompare(b.prazo || "9")).slice(0, 4).map(t => `<div class="li click" data-edit="tarefas" data-id="${t.id}"><div class="t">${esc(t.tarefa)}<div class="m">${fmtD(t.prazo)}</div></div>${pill(t.st, t.al)}</div>`),
            ...R.pes.filter(p => p.st === "crit").slice(0, 2).map(p => `<div class="li"><div class="t">${esc(p.nome)}<div class="m">contato atrasado</div></div>${pill("crit", p.ult ? p.dias + " d" : "nunca")}</div>`),
            ...R.venc.filter(v => v.dias <= 7).slice(0, 2).map(v => `<div class="li"><div class="t">${esc(v.t)}<div class="m">${v.k}</div></div>${pill(v.dias < 0 ? "crit" : "warn", v.dias < 0 ? "atrasado" : "em " + v.dias + " d")}</div>`)].join("") || `<div class="empty">Nada urgente.</div>`}</div></section>
      </div>
    </div>

    <aside class="ws-side" aria-label="Insights">
      <div class="dh2"><span>${ic("index", "var(--plan)")} Data Insights</span></div>
      <details open><summary>Referências cruzadas</summary>
        <div class="xref"><div class="xh">Maiores gastos × receita</div>${Object.entries(F.cat).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c, v]) => `<div class="xr"><i style="background:var(--${tagc(CAT_DESP[c]) === "muted" ? "muted" : tagc(CAT_DESP[c])})"></i><span>${esc(c)}</span><b>${F.rec ? pct(v / F.rec) : eur(v)}</b></div>`).join("") || `<div class="empty">Sem gastos.</div>`}</div>
        <div class="xref"><div class="xh">Áreas: sente × dados</div>${[...R.areas].filter(a => a.perc != null && a.dados != null).sort((a, b) => Math.abs(b.perc - b.dados) - Math.abs(a.perc - a.dados)).slice(0, 5).map(a => `<div class="xr"><i style="background:${a.perc - a.dados > 0 ? "var(--warn)" : "var(--good)"}"></i><span>${esc(a.a)}</span><b>${a.perc} · ${num(a.dados)}</b></div>`).join("")}</div>
      </details>
      <details open><summary>Potencial de economia</summary>
        <div class="xref">
          <div class="xr"><i style="background:var(--crit)"></i><span>Acima do orçamento</span><b class="st-crit">${eur(R.orcCats.filter(c => c.plan && c.real > c.plan).reduce((s, c) => s + c.real - c.plan, 0))}</b></div>
          <div class="xr"><i style="background:var(--warn)"></i><span>Assinaturas pouco usadas</span><b class="st-warn">${eur(R.economia, 2)}/mês</b></div>
          <div class="xr"><i style="background:var(--money)"></i><span>Taxa de poupança</span><b class="st-good">${pct(F.taxa)}</b></div>
          <div class="xr"><i style="background:var(--plan)"></i><span>Com a economia, iria a</span><b>${F.rec ? pct((F.res + econ) / F.rec) : "–"}</b></div>
        </div></details>
      <details open><summary>O que os dados dizem</summary>${ins.slice(0, 4).map(i => `<div class="insight ${i.st}"><div class="ik">${esc(i.k)}</div><p>${i.t}</p></div>`).join("") || `<div class="empty">Registre duas semanas de check-ins.</div>`}</details>
      ${gauge(finScore, "Saúde financeira")}
      ${gauge(R.indice, "Índice de vida")}
      <div class="xref"><div class="xh">Foco do mês</div><div class="reflect ${R.foco ? "" : "ph"}" style="font-size:13px">${esc(R.foco || "Defina na revisão mensal.")}</div></div>
    </aside>
  </div>`;
}

let QTAB = 0;

  return `<div class="grid g2">

    <div class="panel"><h2>Percepção × dados × alvo</h2>${radar(R.areas)}
      <h2 style="margin-top:14px">Alvos por área</h2><div class="form">${AREAS.map((a, i) => `<label>${esc(a)}<input id="alvo${i}" type="number" min="0" max="10" data-alvo="${esc(a)}" value="${S.alvo[a] ?? ""}"></label>`).join("")}</div></div>
    <div class="panel span2" style="grid-column:1/-1"><h2>Revisão mensal · ${mlabel(mk)} <small>15 minutos no último dia do mês</small></h2>
      <div class="form">${[["vitorias", "Vitórias & destaques"], ["naofunc", "O que não funcionou"], ["aprendi", "O que aprendi"], ["foco", "Foco do próximo mês"]].map(([k, l]) => `<label>${l}<textarea id="rev_${k}" data-rev="${k}">${esc(rv[k] || "")}</textarea></label>`).join("")}
      <label>Nota do mês (0–10)<input id="rev_nota" type="number" min="0" max="10" data-rev="nota" value="${rv.nota ?? ""}"></label></div></div>
    <div class="panel" style="grid-column:1/-1"><h2>Histórico</h2><div class="tablewrap"><table><thead><tr><th>Área</th>${R.series.map(s => `<th class="num">${mabbr(s.mk)}</th>`).join("")}</tr></thead><tbody>
      ${AREAS.map(a => `<tr><td style="white-space:nowrap">${esc(a)}</td>${R.series.map(s => { const v = S.roda[s.mk]?.[a]; return `<td class="num" style="${v != null ? `background:color-mix(in srgb, ${v >= 5 ? "var(--div-hi)" : "var(--div-lo)"} ${Math.abs(v - 5) * 9}%, transparent)` : ""}">${v ?? ""}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div></div></div>`;
}

function pMetas(R) {
  const ord = [...R.metas].sort((a, b) => (a.rt === "Concluída") - (b.rt === "Concluída") || (a.prazo || "9").localeCompare(b.prazo || "9"));
  const hz = h => R.metas.filter(m => m.hz === h && m.ativa && m.rt !== "Concluída").length;
  return `<div class="grid g4">${kpi("var(--plan)", "Em andamento", R.metasAnd, `concluídas: ${R.metas.filter(m => m.rt === "Concluída").length}`)}${kpi("var(--plan)", "No ritmo", R.metasRitmo, "progresso ≥ tempo decorrido − 10 pts", "good")}${kpi("var(--plan)", "Atrasadas ou vencidas", R.metasAtras, R.metasAtras ? "replaneje ou ajuste o prazo" : "nenhuma", R.metasAtras ? "crit" : "good")}${kpi("var(--plan)", "Por horizonte", `${hz("Curto")} · ${hz("Médio")} · ${hz("Longo")}`, "curto ≤ 6 meses · médio ≤ 2 anos · longo")}</div>
  <div class="panel" style="margin-top:14px"><div class="toolbar"><h2 style="margin:0">Metas</h2>${addBtn("metas", "Nova meta")}</div>
  ${table("metas", ord, [["Meta", m => `<b>${esc(m.meta)}</b><div class="muted" style="font-size:12px">${esc(m.proximo || "")}</div>`], ["Área", m => esc(m.area)], ["Horizonte", m => m.hz], ["Progresso", m => `<div class="areabar" style="grid-template-columns:38px 1fr;min-width:140px"><span>${pct(m.prog)}</span><div class="bar"><i style="width:${m.prog * 100}%"></i>${m.esp != null ? `<b style="left:${m.esp * 100}%"></b>` : ""}</div></div>`], ["Ritmo", m => pill(m.st, m.rt)], ["Dias", m => m.dias ?? "", "num"], ["Tarefas", m => m.abertas || "", "num"]], { empty: "Escreva 3 a 7 metas mensuráveis, cada uma ligada a uma área." })}</div>`;
}

function pTarefas(R) {
  const ord = [...R.tar].sort((a, b) => (!a.open) - (!b.open) || (a.prazo || "9").localeCompare(b.prazo || "9"));
  const projs = [...new Set(S.tarefas.map(t => t.projeto).filter(Boolean))].map(p => { const ts = R.tar.filter(t => t.projeto === p && t.status !== "Cancelada"); return { p, n: ts.length, d: ts.filter(t => t.status === "Concluída").length, a: ts.filter(t => t.st === "crit").length }; });
  const quads = ["1 · Fazer já", "2 · Agendar", "3 · Resolver rápido", "4 · Depois"];
  return `<div class="grid g4">${kpi("var(--plan)", "Abertas", R.tarAbertas, `alta prioridade: ${R.tar.filter(t => t.open && t.prio === "Alta").length}`)}${kpi("var(--plan)", "Atrasadas", R.tarAtras, R.tarAtras ? "resolva ou replaneje" : "nada atrasado", R.tarAtras ? "crit" : "good")}${kpi("var(--plan)", "Vencem em 7 dias", R.tar7, "inclui hoje", R.tar7 ? "warn" : "")}${kpi("var(--plan)", "Concluídas no mês", R.tarConcl, mlabel(R.mk))}</div>
  <div class="grid g4" style="margin-top:14px">${quads.map((q, i) => { const ts = R.tar.filter(t => t.quad === q); return `<div class="panel"><h2>${q.slice(4)} <small>${["urgente e importante", "importante", "urgente", "nem um nem outro"][i]}</small></h2><div class="list">${ts.slice(0, 6).map(t => `<div class="li click" data-edit="tarefas" data-id="${t.id}" style="cursor:pointer"><div class="t">${esc(t.tarefa)}<div class="m">${t.prazo ? fmtD(t.prazo) : "sem prazo"}</div></div>${pill(t.st, t.al)}</div>`).join("") || `<div class="empty">Vazio.</div>`}</div></div>`; }).join("")}</div>
  <div class="grid g3" style="margin-top:14px"><div class="panel span2"><div class="toolbar"><h2 style="margin:0">Todas as tarefas</h2>${addBtn("tarefas", "Nova tarefa")}</div>
    ${table("tarefas", ord, [["Tarefa", t => t.open ? `<b>${esc(t.tarefa)}</b>` : `<s class="muted">${esc(t.tarefa)}</s>`], ["Projeto", t => esc(t.projeto || "")], ["Prioridade", t => esc(t.prio || "")], ["Prazo", t => fmtD(t.prazo), "num"], ["Alerta", t => pill(t.st, t.al)]])}</div>
    <div class="panel"><h2>Projetos</h2>${projs.map(p => `<div class="li"><div class="t">${esc(p.p)}<div class="m">${p.d} de ${p.n} concluídas${p.a ? ` · <span class="st-crit">${p.a} atrasada(s)</span>` : ""}</div><div class="bar" style="margin-top:6px"><i style="width:${p.n ? p.d / p.n * 100 : 0}%"></i></div></div></div>`).join("") || `<div class="empty">Use o campo Projeto nas tarefas para agrupá-las.</div>`}</div></div>`;
}

function pFinancas(R) {
  const F = R.fin, lm = S.lanc.filter(l => mkey(l.data) === R.mk).sort((a, b) => b.data.localeCompare(a.data));
  const p = S.patr[R.mk] || {};
  return `<div class="grid g4">${kpi("var(--money)", "Receitas", eur(F.rec), mlabel(R.mk))}${kpi("var(--money)", "Despesas", eur(F.desp), R.orcTot ? `${pct(F.desp / R.orcTot)} do orçamento` : "orçamento não definido", R.orcTot ? (F.desp > R.orcTot ? "crit" : "good") : "none")}${kpi("var(--money)", "Resultado", eur(F.res), `aportes ${eur(F.apo)} · caixa ${eur(F.res - F.apo)}`, F.res >= 0 ? "good" : "crit")}${kpi("var(--money)", "Taxa de poupança", pct(F.taxa), `meta ${pct(S.cfg.metaPoup)}`, F.taxa == null ? "none" : F.taxa >= S.cfg.metaPoup ? "good" : "warn")}</div>
  <div class="grid g3" style="margin-top:14px">
    <div class="panel span2"><div class="toolbar"><h2 style="margin:0">Lançamentos de ${mlabel(R.mk)}</h2>${addBtn("lanc", "Novo lançamento")}</div>
      ${table("lanc", lm, [["Data", l => fmtD(l.data), "num"], ["Tipo", l => `<span class="${l.tipo === "Receita" ? "st-good" : l.tipo === "Aporte" ? "" : ""}" style="${l.tipo === "Aporte" ? "color:var(--plan)" : ""}">${esc(l.tipo)}</span>`], ["Categoria", l => esc(l.cat)], ["Descrição", l => esc(l.desc)], ["Valor", l => eur(+l.valor, 2), "num"]], { empty: "Nenhum lançamento neste mês." })}</div>
    <div class="grid" style="align-content:start">
      <div class="panel"><h2>Orçamento <small>% usado · ritmo ${pct(R.DR / dim(R.mk))} do mês</small></h2>
        ${R.orcCats.map(c => `<div class="li"><div class="t" style="font-weight:500">${esc(c.cat)}<div class="bar" style="margin-top:5px;--c:${c.st === "crit" ? "var(--crit)" : c.st === "warn" ? "var(--warn)" : "var(--money)"}"><i style="width:${clamp(c.p ?? 0) * 100}%"></i></div></div><div style="text-align:right"><div class="mono" style="font-size:12px">${eur(c.real)}${c.plan ? " / " + eur(c.plan) : ""}</div><input type="number" aria-label="Orçamento de ${esc(c.cat)}" data-orc="${esc(c.cat)}" value="${S.orc[c.cat] ?? ""}" placeholder="plano" style="width:84px;padding:3px 6px;margin-top:3px"></div></div>`).join("")}
        <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Definir orçamento de outras categorias</summary>${Object.keys(CAT_DESP).filter(c => !R.orcCats.some(x => x.cat === c)).map(c => `<div class="li"><span>${esc(c)}</span><input type="number" aria-label="Orçamento de ${esc(c)}" data-orc="${esc(c)}" placeholder="plano" style="width:84px;padding:3px 6px"></div>`).join("")}</details></div>
      <div class="panel"><h2>Distribuição <small>referência 50/30/20</small></h2>${hbars([...R.dist.map(d => ({ l: d.g, v: F.rec ? d.v / F.rec : 0 })), { l: "Poupança", v: F.rec ? Math.max(0, F.res) / F.rec : 0 }], { color: "var(--money)", fmt: pct, max: 1 })}</div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="panel"><h2>Patrimônio · fim de ${mlabel(R.mk)} <small>preencha no fim do mês</small></h2>
      <div class="form">${[["contas", "Contas & caixa"], ["reserva", "Reserva de emergência"], ["invest", "Investimentos"], ["outros", "Outros bens"], ["dividas", "(−) Dívidas"]].map(([k, l]) => `<label>${l}<input id="patr_${k}" type="number" data-patr="${k}" value="${p[k] ?? ""}"></label>`).join("")}</div>
      <div style="margin-top:12px;display:flex;gap:18px;flex-wrap:wrap"><div><div class="muted" style="font-size:12px">Patrimônio líquido</div><div class="mono" style="font-size:18px;font-weight:600">${R.pl == null ? "–" : eur(R.pl)}</div></div><div><div class="muted" style="font-size:12px">Reserva cobre</div><div class="mono" style="font-size:18px;font-weight:600">${R.reserva == null ? "–" : num(R.reserva) + " meses"}</div></div></div></div>
    <div class="panel"><h2>Resultado por mês</h2>${colChart(R.series.map(s => mabbr(s.mk)), [{ name: "Receitas", color: "var(--plan)", data: R.series.map(s => s.rec) }, { name: "Despesas", color: "var(--body)", data: R.series.map(s => s.desp) }, { name: "Aportes", color: "var(--money)", data: R.series.map(s => s.apo) }], { hi: 11 })}</div>
  </div>`;
}

let checkin = null;
function pSaude(R) {
  const day = checkin || TODAY, e = S.saude[day] || {};
  const scale = (k, lbl, inv) => `<div><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:4px">${lbl} ${inv ? "(1 tranquilo · 5 tenso)" : "(1 ruim · 5 ótimo)"}</div><div class="chips">${[1, 2, 3, 4, 5].map(v => `<button class="chip" data-sd="${k}" data-v="${v}" aria-pressed="${e[k] == v}">${v}</button>`).join("")}</div></div>`;
  const last = Object.entries(S.saude).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 14);
  return `<div class="grid g4">${kpi("var(--body)", "Sono médio", R.sono == null ? "–" : num(R.sono) + " h", `meta ${num(S.cfg.metaSono)} h`, R.sono == null ? "none" : R.sono >= S.cfg.metaSono ? "good" : "warn")}${kpi("var(--body)", "Humor médio", R.humor == null ? "–" : num(R.humor) + "/5", `energia ${num(R.energia)} · estresse ${num(R.estresse)}`)}${kpi("var(--body)", "Treinos", R.treinos, `${R.minTreino} min · meta ${Math.round(S.cfg.metaTreinos * R.DR / 7)}`)}${kpi("var(--body)", "Peso atual", R.peso == null ? "–" : num(R.peso) + " kg", `${R.diasReg} dias registrados no mês`)}</div>
  <div class="grid g3" style="margin-top:14px">
    <div class="panel span2"><div class="toolbar"><h2 style="margin:0">Check-in diário</h2><input type="date" id="ck_day" value="${day}" style="width:auto"></div>
      <div class="grid g2">${scale("humor", "Humor")}${scale("energia", "Energia")}${scale("estresse", "Estresse", 1)}${scale("qual", "Qualidade do sono")}</div>
      <div class="form" style="margin-top:12px"><label>Sono (h)<input id="sd_sono" type="number" step="0.5" data-sdi="sono" value="${e.sono ?? ""}"></label><label>Treino<select id="sd_treino" data-sdi="treino"><option></option>${TREINOS.map(t => `<option ${e.treino === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label>Treino (min)<input id="sd_min" type="number" data-sdi="min" value="${e.min ?? ""}"></label><label>Passos<input id="sd_passos" type="number" data-sdi="passos" value="${e.passos ?? ""}"></label><label>Peso (kg)<input id="sd_peso" type="number" step="0.1" data-sdi="peso" value="${e.peso ?? ""}"></label>
        <label class="full">Como me senti · o que marcou o dia<textarea id="sd_nota" data-sdi="nota">${esc(e.nota || "")}</textarea></label></div></div>
    <div class="panel"><h2>Humor · 28 dias</h2>${strip(R.days28, "humor", "div")}<h2 style="margin-top:16px">Treinos por mês</h2>${colChart(R.saudeSeries.map(s => mabbr(s.mk)), [{ name: "Treinos", color: "var(--body)", data: R.saudeSeries.map(s => s.treinos) }], { h: 170, hi: 11 })}</div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Últimos registros</h2><div class="tablewrap"><table><thead><tr><th>Dia</th><th class="num">Sono</th><th class="num">Humor</th><th class="num">Energia</th><th class="num">Estresse</th><th>Treino</th><th class="num">Peso</th><th>Notas</th></tr></thead><tbody>
    ${last.map(([d, x]) => `<tr class="click" data-day="${d}" tabindex="0"><td class="num">${fmtD(d)}</td><td class="num">${x.sono ?? ""}</td><td class="num">${x.humor ?? ""}</td><td class="num">${x.energia ?? ""}</td><td class="num">${x.estresse ?? ""}</td><td>${esc(x.treino || "")}${x.min ? ` · ${x.min}′` : ""}</td><td class="num">${x.peso ?? ""}</td><td class="muted">${esc(x.nota || "")}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">Faça seu primeiro check-in acima.</td></tr>`}</tbody></table></div></div>`;
}

function pHabitos(R) {
  const days = []; for (let k = 13; k >= 0; k--) days.push(addDays(TODAY, -k));
  const wd = ["D", "S", "T", "Q", "Q", "S", "S"];
  return `<div class="grid g4">${kpi("var(--body)", "% da meta (média)", pct(R.habMeta), mlabel(R.mk), R.habMeta == null ? "none" : R.habMeta >= .9 ? "good" : "warn")}${kpi("var(--body)", "Feitos no mês", sum(R.hab.map(h => h.feitos)), `${R.hab.length} hábitos`)}${kpi("var(--body)", "Maior sequência", R.hab.length ? Math.max(...R.hab.map(h => h.streak)) + " dias" : "–", R.hab.length ? esc([...R.hab].sort((a, b) => b.streak - a.streak)[0].nome) : "")}${kpi("var(--body)", "Abaixo da meta", R.hab.filter(h => h.st === "crit").length, "menos de 60% da meta", R.hab.some(h => h.st === "crit") ? "crit" : "good")}</div>
  <div class="panel" style="margin-top:14px"><div class="toolbar"><h2 style="margin:0">Últimas 2 semanas <small>toque para marcar</small></h2>${addBtn("habitos", "Novo hábito")}</div>
  <div class="tablewrap"><div class="hgrid"><div></div>${days.map(d => `<div class="hd ${d === TODAY ? "today" : ""}">${wd[parse(d).getDay()]}<br>${d.slice(8)}</div>`).join("")}<div class="hd">mês</div>
  ${R.hab.map(h => `<div class="click" data-edit="habitos" data-id="${h.id}" style="cursor:pointer;min-width:0"><b>${esc(h.nome)}</b><div class="muted" style="font-size:11px">${esc(h.area || "")} · ${h.meta}×/sem · seq. ${h.streak}</div></div>${days.map(d => `<button class="tick ${S.marks[h.id + "|" + d] ? "on" : ""}" data-mark="${h.id}|${d}" aria-label="${esc(h.nome)} em ${fmtD(d)}" aria-pressed="${!!S.marks[h.id + "|" + d]}"></button>`).join("")}<div>${h.pm == null ? "" : pill(h.st, pct(h.pm))}</div>`).join("")}
  </div></div>${R.hab.length ? "" : `<div class="empty">Crie até 10 hábitos, cada um ligado a uma área da vida.</div>`}</div>
  <div class="panel" style="margin-top:14px"><h2>Cumprimento por dia · 28 dias</h2>${strip(R.days28, "hab", "seq")}</div>`;
}

function pCarreira(R) {
  return `<div class="grid g3">${kpi("var(--grow)", "Candidaturas ativas", R.candAtivas, "aplicado, entrevista, teste ou proposta")}${kpi("var(--grow)", "Competências", pct(R.compPct), "média do nível atual ÷ alvo")}${kpi("var(--grow)", "Ações atrasadas", S.cand.filter(c => c.dataAcao && c.dataAcao < TODAY && !["Aceito", "Recusado", "Desisti"].includes(c.etapa)).length, "próximas ações das candidaturas")}</div>
  <div class="grid g2" style="margin-top:14px"><div class="panel"><div class="toolbar"><h2 style="margin:0">Competências <small>1 iniciante · 5 referência</small></h2>${addBtn("comp", "Nova")}</div>
    ${table("comp", S.comp, [["Competência", c => `<b>${esc(c.nome)}</b>`], ["Nível", c => `<span style="color:var(--grow);letter-spacing:2px">${"●".repeat(+c.atual || 0)}${"○".repeat(Math.max(0, (+c.alvo || 0) - (+c.atual || 0)))}</span>`], ["Gap", c => (+c.alvo - +c.atual) || "", "num"]])}</div>
  <div class="panel"><div class="toolbar"><h2 style="margin:0">Candidaturas</h2>${addBtn("cand", "Nova")}</div>
    ${table("cand", [...S.cand].sort((a, b) => (b.data || "").localeCompare(a.data || "")), [["Empresa", c => `<b>${esc(c.empresa)}</b><div class="muted" style="font-size:12px">${esc(c.cargo)}</div>`], ["Etapa", c => esc(c.etapa)], ["Próxima ação", c => { const late = c.dataAcao && c.dataAcao < TODAY && !["Aceito", "Recusado", "Desisti"].includes(c.etapa); return `${esc(c.acao || "")}${c.dataAcao ? ` ${pill(late ? "crit" : diff(c.dataAcao, TODAY) <= 3 ? "warn" : "none", fmtD(c.dataAcao))}` : ""}`; }]])}</div></div>`;
}

function pAprend(R) {
  const est = [...S.estudo].sort((a, b) => b.data.localeCompare(a.data));
  const horas = t => sum(S.estudo.filter(e => e.item === t).map(e => e.horas));
  return `<div class="grid g4">${kpi("var(--grow)", "Estudo no mês", num(R.horasEst) + " h", `meta ${S.cfg.metaEstudo} h/mês`)}${kpi("var(--grow)", "Livros no ano", R.livros, `meta ${S.cfg.metaLivros}`)}${kpi("var(--grow)", "Em andamento", S.aprend.filter(a => a.status === "Em andamento").length, S.aprend.filter(a => a.status === "Em andamento").length > 3 ? "▲ muitos ao mesmo tempo dispersam" : "foco saudável")}${kpi("var(--grow)", "Sessões no mês", S.estudo.filter(e => mkey(e.data) === R.mk).length, mlabel(R.mk))}</div>
  <div class="grid g3" style="margin-top:14px"><div class="panel span2"><div class="toolbar"><h2 style="margin:0">O que estou aprendendo</h2>${addBtn("aprend", "Novo item")}</div>
    ${table("aprend", [...S.aprend].sort((a, b) => (a.status !== "Em andamento") - (b.status !== "Em andamento")), [["Título", a => `<b>${esc(a.titulo)}</b><div class="muted" style="font-size:12px">${esc(a.tipo)} · ${esc(a.area || "")}</div>`], ["Status", a => esc(a.status)], ["Progresso", a => { const p = a.status === "Concluído" ? 1 : +a.total ? clamp(+a.atual / +a.total) : 0; return `<div class="areabar" style="grid-template-columns:38px 1fr;min-width:120px"><span>${pct(p)}</span><div class="bar" style="--c:var(--grow)"><i style="width:${p * 100}%"></i></div></div>`; }], ["Horas", a => num(horas(a.titulo)), "num"]])}</div>
  <div class="panel"><div class="toolbar"><h2 style="margin:0">Sessões</h2>${addBtn("estudo", "Registrar")}</div>${table("estudo", est, [["Dia", e => fmtD(e.data), "num"], ["Assunto", e => esc(e.item)], ["h", e => num(+e.horas), "num"]], { limit: 12 })}</div></div>`;
}

function pRelacoes(R) {
  return `<div class="grid g4">${kpi("var(--people)", "Pessoas", S.pessoas.length, `família ${S.pessoas.filter(p => p.relacao === "Família").length} · amigos ${S.pessoas.filter(p => p.relacao === "Amizade").length}`)}${kpi("var(--people)", "Em dia", pct(R.relEmDia), "dentro da frequência desejada", R.relEmDia == null ? "none" : R.relEmDia >= .8 ? "good" : "warn")}${kpi("var(--people)", "Atrasados", R.relAtras, R.relAtras ? "veja a lista" : "ninguém esquecido", R.relAtras ? "crit" : "good")}${kpi("var(--people)", "Contatos no mês", R.contMes.length, `qualidade média ${num(avg(R.contMes.map(c => +c.qual).filter(Boolean)))}/5`)}</div>
  <div class="grid g3" style="margin-top:14px"><div class="panel span2"><div class="toolbar"><h2 style="margin:0">Pessoas</h2>${addBtn("pessoas", "Nova pessoa")}</div>
    ${table("pessoas", [...R.pes].sort((a, b) => b.ratio - a.ratio), [["Nome", p => `<b>${esc(p.nome)}</b><div class="muted" style="font-size:12px">${esc(p.relacao)} · a cada ${p.freq || "–"} dias</div>`], ["Último contato", p => p.ult ? `${fmtD(p.ult)} <span class="muted">(${p.dias} d)</span>` : "–"], ["Status", p => pill(p.st, p.txt)], ["Aniversário", p => p.prox ? `${fmtD(p.prox)} <span class="muted">em ${p.faltam} d</span>` : ""]])}</div>
  <div class="panel"><div class="toolbar"><h2 style="margin:0">Contatos</h2>${addBtn("contatos", "Registrar")}</div>${table("contatos", [...S.contatos].sort((a, b) => b.data.localeCompare(a.data)), [["Dia", c => fmtD(c.data), "num"], ["Pessoa", c => esc(c.pessoa)], ["Tipo", c => esc(c.tipo)]], { limit: 14 })}</div></div>`;
}

function pLazer(R) {
  return `<div class="grid g4">${kpi("var(--people)", "Horas no mês", num(R.horasLaz) + " h", `meta ${Math.round(S.cfg.metaLazer * R.DR / 7)} h até agora`)}${kpi("var(--people)", "Atividades", R.lazN, mlabel(R.mk))}${kpi("var(--people)", "Satisfação", num(R.lazSat) + "/5", "quanto recarregou")}${kpi("var(--people)", "Gasto com lazer", eur(R.lazCusto), R.horasLaz ? `${eur(R.lazCusto / R.horasLaz)} por hora` : "")}</div>
  <div class="grid g3" style="margin-top:14px"><div class="panel span2"><div class="toolbar"><h2 style="margin:0">Registro de lazer</h2>${addBtn("lazer", "Registrar")}</div>
    ${table("lazer", [...S.lazer].sort((a, b) => b.data.localeCompare(a.data)), [["Dia", l => fmtD(l.data), "num"], ["Atividade", l => `<b>${esc(l.atividade)}</b>`], ["Categoria", l => esc(l.cat)], ["Horas", l => num(+l.horas), "num"], ["Satisfação", l => "★".repeat(+l.sat || 0)]], { limit: 15 })}</div>
  <div class="panel"><div class="toolbar"><h2 style="margin:0">Lista de sonhos</h2>${addBtn("sonhos", "Novo")}</div>${table("sonhos", S.sonhos, [["Sonho", s => s.status === "Realizado" ? `<s class="muted">${esc(s.sonho)}</s>` : `<b>${esc(s.sonho)}</b>`], ["Status", s => pill(s.status === "Realizado" ? "good" : s.status === "Agendado" ? "warn" : "none", s.status)]])}</div></div>`;
}

function pCasa(R) {
  return `<div class="grid g4">${kpi("var(--home)", "Documentos a renovar", R.docs.filter(d => d.st === "warn" || d.st === "crit").length, `aviso com ${S.cfg.alertaDocs} dias`, R.docs.some(d => d.st === "crit") ? "crit" : "")}${kpi("var(--home)", "Rotinas atrasadas", R.rot.filter(r => r.st === "crit").length, `${R.rot.filter(r => r.st === "warn").length} nos próximos 7 dias`, R.rot.some(r => r.st === "crit") ? "crit" : "good")}${kpi("var(--home)", "Assinaturas / mês", eur(R.assMes, 2), `${eur(R.assMes * 12)} por ano`)}${kpi("var(--home)", "Economia possível", eur(R.economia, 2), "por mês, em serviços de pouco uso", R.economia ? "warn" : "good")}</div>
  <div class="grid g3" style="margin-top:14px">
    <div class="panel"><div class="toolbar"><h2 style="margin:0">Documentos</h2>${addBtn("docs", "Novo")}</div>${table("docs", [...R.docs].sort((a, b) => (a.dias ?? 1e9) - (b.dias ?? 1e9)), [["Documento", d => `<b>${esc(d.doc)}</b><div class="muted" style="font-size:12px">${esc(d.acao || "")}</div>`], ["Validade", d => d.validade ? fmtD(d.validade) + "/" + d.validade.slice(2, 4) : "", "num"], ["", d => pill(d.st, d.txt)]])}</div>
    <div class="panel"><div class="toolbar"><h2 style="margin:0">Rotinas</h2>${addBtn("rotinas", "Nova")}</div>
      <div class="list">${[...R.rot].sort((a, b) => (a.dias ?? 1e9) - (b.dias ?? 1e9)).map(r => `<div class="li"><div class="t click" data-edit="rotinas" data-id="${r.id}" style="cursor:pointer">${esc(r.rotina)}<div class="m">a cada ${r.freq} d · próxima ${fmtD(r.prox)}</div></div><div style="display:flex;gap:6px;align-items:center">${pill(r.st, r.txt)}<button class="btn" data-done="${r.id}" title="Marcar como feita hoje">Feito</button></div></div>`).join("") || `<div class="empty">Cadastre limpezas, backups, revisões.</div>`}</div></div>
    <div class="panel"><div class="toolbar"><h2 style="margin:0">Assinaturas</h2>${addBtn("assin", "Nova")}</div>${table("assin", R.ass, [["Serviço", a => `<b>${esc(a.servico)}</b>`], ["Mês", a => eur(a.mensal, 2), "num"], ["Uso", a => a.uso === "Baixo" ? pill("crit", "cancelar?") : esc(a.uso)]])}</div>
  </div>`;
}

function pConfig() {
  const C = S.cfg;
  const f = [["nome", "Seu nome", "text"], ["metaPoup", "Meta de taxa de poupança (0–1)", "number"], ["metaReserva", "Reserva de emergência (meses)", "number"], ["metaSono", "Sono (h/noite)", "number"], ["metaTreinos", "Treinos por semana", "number"], ["metaPassos", "Passos por dia", "number"], ["metaEstudo", "Horas de estudo por mês", "number"], ["metaLivros", "Livros no ano", "number"], ["metaLazer", "Horas de lazer por semana", "number"], ["alertaDocs", "Avisar documentos (dias antes)", "number"], ["alertaAniv", "Avisar aniversários (dias antes)", "number"]];
  return `<div class="grid g2"><div class="panel"><h2>Parâmetros e metas</h2><div class="form">${f.map(([k, l, t]) => `<label>${l}<input id="cfg_${k}" type="${t}" step="any" data-cfg="${k}" value="${esc(C[k] ?? "")}"></label>`).join("")}</div></div>
  <div class="panel"><h2>Seus dados</h2><p class="muted">${STORE?.kind === "db" ? "Salvos na sua conta, de forma privada: só você vê." : STORE?.kind === "local" ? "Salvos apenas neste navegador." : "Conectando ao armazenamento…"}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" id="loadEx">Carregar dados de exemplo</button><button class="btn danger" id="wipe">Apagar tudo e começar do zero</button></div>
    <h2 style="margin-top:18px">Como o índice é calculado</h2><p class="muted" style="font-size:13px">Cada área recebe um placar de 0 a 10: a média dos componentes que têm dados (metas da área no ritmo, hábitos da área em % da meta e até 3 métricas próprias, como taxa de poupança ou contatos em dia). Componente sem dados é ignorado, nunca conta como zero. O índice é a média das áreas × 10.</p></div></div>`;
}

/* ============================================================ render */
function render() {
  const R = calc();
  $("#nav").innerHTML = `<div class="brand">Painel da Vida<small>${esc(S.cfg.nome || "seu sistema pessoal")}</small></div>` + PAGES.map(([k, l, c, g]) => (g ? `<div class="navgroup">${g}</div>` : "") + `<a href="#${k}" style="--c:${c}" ${k === PAGE ? 'aria-current="page"' : ""}><span class="dot"></span>${l}</a>`).join("");
  const title = PAGES.find(p => p[0] === PAGE)[1];
  const banner = IS_EXAMPLE && LOADED ? `<div class="banner"><span><b>Dados de exemplo.</b> São fictícios, para você ver tudo funcionando. Ao editar qualquer coisa, eles viram seus e passam a ser salvos.</span><button class="btn primary" id="startEmpty">Começar com tudo vazio</button></div>` : "";
  const body = { painel: pPainel, roda: pRoda, metas: pMetas, tarefas: pTarefas, financas: pFinancas, saude: pSaude, habitos: pHabitos, carreira: pCarreira, aprendizado: pAprend, relacoes: pRelacoes, lazer: pLazer, casa: pCasa, config: pConfig }[PAGE](R);
  const focusId = document.activeElement?.id, selS = document.activeElement?.selectionStart;
  const filt = PAGE === "painel" ? `<div class="tfilters"><div class="fgrp"><span class="flbl">Janela</span>${[3, 6, 12].map(n => `<button class="seg" data-per="${n}" aria-pressed="${PER === n}">${n}m</button>`).join("")}</div><div class="fgrp"><span class="flbl">Área</span><select id="fArea" aria-label="Filtrar por área"><option value="">Todas</option>${AREAS.map(a => `<option ${a === AREA ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></div></div>` : "";
  $("#main").innerHTML = `<div class="topbar"><div><div class="crumb">Painel da Vida / <b>${PAGE === "painel" ? "Visão geral" : title}</b></div><h1>${PAGE === "painel" ? (S.cfg.nome ? "Olá, " + esc(S.cfg.nome) : "Gestão da vida") : title}</h1><div class="sub">${PAGE === "painel" ? `Visão integrada de ${mlabel(REF)} · dados até ${R.corte ? fmtD(R.corte) : "–"}` : mlabel(REF)} <span class="saving">${LOADED ? "" : "· carregando seus dados…"}</span></div></div>
    <div class="monthpick" aria-label="Mês de referência"><button id="mPrev" aria-label="Mês anterior">‹</button><span>${mlabel(REF)}</span><button id="mNext" aria-label="Próximo mês">›</button><button id="mNow" style="width:auto;padding:0 8px;font-size:12px;font-weight:600">Hoje</button></div>${filt}</div>${banner}${body}`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch {} } }
}

/* ============================================================ eventos */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-edit],[data-day]"); if (!t) return;
  if (t.id === "mPrev") { REF = addMonth(REF, -1); render(); } else if (t.id === "mNext") { REF = addMonth(REF, 1); render(); } else if (t.id === "mNow") { REF = mkey(TODAY); render(); }
  else if (t.id === "startEmpty" || t.id === "wipe") { if (t.id === "wipe" && !t.dataset.c) { t.dataset.c = 1; t.textContent = "Confirmar: apagar tudo"; return; } S = EMPTY(); MEMO = null; IS_EXAMPLE = false; KEYS.forEach(k => dirty.add(k)); flush(); render(); toast("Tudo vazio. Comece por Ajustes e Metas."); }
  else if (t.id === "loadEx") { S = exampleData(); IS_EXAMPLE = true; MEMO = null; render(); toast("Exemplo carregado (não salvo)"); }
  else if (t.dataset.per) { PER = +t.dataset.per; render(); }
  else if (t.dataset.area != null) { AREA = !t.dataset.area || AREA === t.dataset.area ? null : t.dataset.area; render(); }
  else if (t.dataset.q != null) { QTAB = +t.dataset.q; render(); }
  else if (t.dataset.add) openForm(t.dataset.add);
  else if (t.dataset.edit) openForm(t.dataset.edit, t.dataset.id);
  else if (t.dataset.mark) { const k = t.dataset.mark; if (S.marks[k]) delete S.marks[k]; else S.marks[k] = 1; touch("marks"); }
  else if (t.dataset.done) { S.rotinas = S.rotinas.map(r => r.id === t.dataset.done ? { ...r, ultima: TODAY } : r); touch("rotinas"); toast("Rotina registrada hoje"); }
  else if (t.dataset.sd) { const d = checkin || TODAY; S.saude[d] = { ...(S.saude[d] || {}), [t.dataset.sd]: +t.dataset.v }; touch("saude"); }
  else if (t.dataset.day) { checkin = t.dataset.day; render(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr.click")) e.target.click(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.roda != null) { S.roda[REF] = { ...(S.roda[REF] || {}), [t.dataset.roda]: +t.value }; t.nextElementSibling.textContent = t.value; }
});
document.addEventListener("change", e => {
  const t = e.target, v = t.value;
  if (t.dataset.roda != null) touch("roda");
  else if (t.dataset.prio != null) { S.prio[+t.dataset.prio] = v; touch("prio"); }
  else if (t.dataset.alvo != null) { S.alvo[t.dataset.alvo] = v === "" ? null : +v; touch("alvo"); }
  else if (t.dataset.rev) { S.revisao[REF] = { ...(S.revisao[REF] || {}), [t.dataset.rev]: t.dataset.rev === "nota" ? +v : v }; touch("revisao"); }
  else if (t.dataset.orc) { if (v === "") delete S.orc[t.dataset.orc]; else S.orc[t.dataset.orc] = +v; touch("orc"); }
  else if (t.dataset.patr) { S.patr[REF] = { ...(S.patr[REF] || {}), [t.dataset.patr]: v === "" ? "" : +v }; touch("patr"); }
  else if (t.dataset.cfg) { S.cfg[t.dataset.cfg] = t.type === "number" ? +v : v; touch("cfg"); }
  else if (t.dataset.sdi) { const d = checkin || TODAY; const val = t.type === "number" ? (v === "" ? null : +v) : v; S.saude[d] = { ...(S.saude[d] || {}), [t.dataset.sdi]: val }; touch("saude"); }
  else if (t.id === "fArea") { AREA = v || null; render(); }
  else if (t.id === "ck_day") { checkin = v || TODAY; render(); }
});
document.addEventListener("mouseover", e => { const el = e.target.closest?.("[data-tip]"), tp = $("#tip"); if (!el) { tp.hidden = true; return; } tp.textContent = el.dataset.tip; tp.hidden = false; });
document.addEventListener("mousemove", e => { const tp = $("#tip"); if (tp.hidden) return; const x = Math.min(e.clientX + 14, innerWidth - tp.offsetWidth - 8); tp.style.left = x + "px"; tp.style.top = (e.clientY + 16) + "px"; });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGES.some(p => p[0] === h)) { PAGE = h; checkin = null; render(); $("#main").focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } });

/* ============================================================ inicialização */
S = exampleData(); REF = addMonth(mkey(TODAY), -1); render();
(async () => {
  let loaded = {};
  try {
    const db = await window.claude?.use?.("db"), user = db ? await window.claude.use("user") : null;
    const id = user ? await user.id() : null;
    if (db && id) {
      const col = db.collection("data/users/" + id); STORE = { kind: "db", col };
      const snap = await col.get(); for (const d of snap.docs) if (d.id.startsWith("s_")) loaded[d.id.slice(2)] = d.data()?.v;
    }
  } catch (e) { STORE = null; }
  if (!STORE) { STORE = { kind: "local" }; for (const k of KEYS) try { const v = localStorage.getItem("pv_" + k); if (v) loaded[k] = JSON.parse(v); } catch {} }
  if (Object.keys(loaded).length) { const E = EMPTY(); S = { ...E, ...loaded, cfg: { ...E.cfg, ...(loaded.cfg || {}) } }; IS_EXAMPLE = false; REF = mkey(TODAY); }
  LOADED = true; MEMO = null; render();
})();
</script>
