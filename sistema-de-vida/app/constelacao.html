  const C = S.cfg;
  const f = [["nome", "Seu nome", "text"], ["metaPoup", "Meta de taxa de poupança (0–1)", "number"], ["metaReserva", "Reserva de emergência (meses)", "number"], ["metaSono", "Sono (h/noite)", "number"], ["metaTreinos", "Treinos por semana", "number"], ["metaPassos", "Passos por dia", "number"], ["metaEstudo", "Horas de estudo por mês", "number"], ["metaLivros", "Livros no ano", "number"], ["metaLazer", "Horas de lazer por semana", "number"], ["alertaDocs", "Avisar documentos (dias antes)", "number"], ["alertaAniv", "Avisar aniversários (dias antes)", "number"]];
  return `<div class="grid g2"><div class="panel"><h2>Parâmetros e metas</h2><div class="form">${f.map(([k, l, t]) => `<label>${l}<input id="cfg_${k}" type="${t}" step="any" data-cfg="${k}" value="${esc(C[k] ?? "")}"></label>`).join("")}</div></div>
  <div class="panel"><h2>Seus dados</h2><p class="muted">${STORE?.kind === "db" ? "Salvos na sua conta, de forma privada: só você vê." : STORE?.kind === "local" ? "Salvos apenas neste navegador." : "Conectando ao armazenamento…"}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" id="loadEx">Carregar dados de exemplo</button><button class="btn danger" id="wipe">Apagar tudo e começar do zero</button></div>
    <h2 style="margin-top:18px">Como o índice é calculado</h2><p class="muted" style="font-size:13px">Cada área recebe um placar de 0 a 10: a média dos componentes que têm dados (metas da área no ritmo, hábitos da área em % da meta e até 3 métricas próprias, como taxa de poupança ou contatos em dia). Componente sem dados é ignorado, nunca conta como zero. O índice é a média das áreas × 10.</p></div></div>`;
}

/* ============================================================ CONSTELAÇÃO: rede das áreas, dossiê e rio do tempo */
let FOCUS = null;          // área em foco (nó selecionado)
let EDGE = null;           // índice da ligação selecionada
const AREA_COLOR = {
  "Saúde física": "var(--body)", "Saúde mental": "var(--body)", "Finanças": "var(--money)", "Carreira": "var(--grow)",
  "Aprendizado": "var(--grow)", "Família": "var(--people)", "Amor & parceria": "var(--people)", "Amizades & social": "var(--people)",
  "Lazer & criatividade": "var(--people)", "Propósito & espiritualidade": "var(--plan)", "Casa & organização": "var(--home)" };
const AREA_PAGE = { "Saúde física": "saude", "Saúde mental": "saude", "Finanças": "financas", "Carreira": "carreira", "Aprendizado": "aprendizado",
  "Família": "relacoes", "Amor & parceria": "relacoes", "Amizades & social": "relacoes", "Lazer & criatividade": "lazer", "Propósito & espiritualidade": "habitos", "Casa & organização": "casa" };
const SHORT = a => ({ "Amor & parceria": "Amor", "Amizades & social": "Amizades", "Lazer & criatividade": "Lazer", "Propósito & espiritualidade": "Propósito", "Casa & organização": "Casa" }[a] || a);

/* ligações entre áreas: efeitos medidos nos seus próprios registros */
function edges(R) {
  const ini = addDays(R.corte || TODAY, -PER * 30), fim = R.corte || TODAY;
  const days = Object.entries(S.saude).filter(([d, e]) => d >= ini && d <= fim);
  const split = (pred, key) => { const A = [], B = []; for (const [d, e] of days) { if (e[key] == null) continue; const p = pred(d, e); if (p === true) A.push(+e[key]); else if (p === false) B.push(+e[key]); }
    return A.length >= 5 && B.length >= 5 ? { a: avg(A), b: avg(B), d: avg(A) - avg(B), n: A.length } : null; };
  const out = [], add = (x, y, r, txt, how) => { if (r && Math.abs(r.d) >= .12) out.push({ x, y, d: r.d, w: Math.min(1, Math.abs(r.d) / .9), txt: txt(r), how }); };
  add("Saúde física", "Saúde mental", split((d, e) => e.sono == null ? null : e.sono >= S.cfg.metaSono, "humor"),
    r => `Com ≥ ${num(S.cfg.metaSono)} h de sono o humor médio é ${num(r.a)}; nos outros dias, ${num(r.b)}.`, "sono × humor");
  add("Saúde física", "Carreira", split((d, e) => !!e.treino, "energia"), r => `Em dias de treino a energia é ${num(r.a)}; sem treino, ${num(r.b)}. Energia sustenta o trabalho.`, "treino × energia");
  const byRel = rel => { const names = new Set(S.pessoas.filter(p => p.relacao === rel).map(p => p.nome)); return new Set(S.contatos.filter(c => names.has(c.pessoa)).map(c => c.data)); };
  for (const [rel, area] of [["Família", "Família"], ["Parceria", "Amor & parceria"], ["Amizade", "Amizades & social"]]) {
    const ds = byRel(rel); add(area, "Saúde mental", split(d => ds.has(d), "estresse"), r => `Nos dias com contato (${rel.toLowerCase()}) o estresse é ${num(r.a)}; sem contato, ${num(r.b)}.`, "contato × estresse");
  }
  const lz = new Set(S.lazer.map(l => l.data)); add("Lazer & criatividade", "Saúde mental", split(d => lz.has(d), "humor"), r => `Em dias com lazer registrado o humor é ${num(r.a)}; sem lazer, ${num(r.b)}.`, "lazer × humor");
  const st = new Set(S.estudo.map(e => e.data)); add("Aprendizado", "Saúde mental", split(d => st.has(d), "energia"), r => `Em dias de estudo a energia é ${num(r.a)}; nos demais, ${num(r.b)}.`, "estudo × energia");
  const byArea = {}; for (const h of S.habitos) if (h.area && h.area !== "Saúde mental") { (byArea[h.area] ||= []).push(h); }
  for (const a in byArea) { const hs = byArea[a]; const r = split(d => hs.some(h => S.marks[`${h.id}|${d}`]) ? true : false, "humor");
    if (!out.some(e => e.x === a && e.y === "Saúde mental")) add(a, "Saúde mental", r, r => `Quando cumpre hábitos de ${SHORT(a)} (${hs.map(h => h.nome).slice(0, 2).join(", ")}) o humor é ${num(r.a)}; quando não, ${num(r.b)}.`, "hábitos × humor"); }
  // ligações estruturais (não estatísticas): dinheiro e tempo que uma área consome da outra
  const F = R.fin, laz = ["Lazer & passeios", "Viagens", "Restaurantes & cafés"].reduce((s, c) => s + (F.cat[c] || 0), 0);
  if (F.desp > 0 && laz > 0) out.push({ x: "Finanças", y: "Lazer & criatividade", d: 0, w: Math.min(1, laz / F.desp * 2.5), txt: `${pct(laz / F.desp)} das despesas do mês (${eur(laz)}) foram para lazer, viagens e restaurantes.`, how: "dinheiro", flow: true });
  const edu = (F.cat["Educação & cursos"] || 0) + (F.cat["Livros & materiais"] || 0);
  if (edu > 0) out.push({ x: "Finanças", y: "Aprendizado", d: 0, w: Math.min(1, edu / Math.max(1, F.desp) * 3), txt: `${eur(edu)} investidos em educação e livros no mês.`, how: "dinheiro", flow: true });
  const carH = sum(S.estudo.filter(e => e.data >= ini && S.aprend.some(a => a.titulo === e.item && a.area === "Carreira")).map(e => e.horas));
  if (carH > 0) out.push({ x: "Aprendizado", y: "Carreira", d: 0, w: Math.min(1, carH / 60), txt: `${num(carH, 0)} h de estudo nos últimos ${PER} meses foram para itens de carreira.`, how: "tempo", flow: true });
  const shared = S.tarefas.filter(t => t.meta && !["Concluída", "Cancelada"].includes(t.status)).map(t => [t.area, S.metas.find(m => m.meta === t.meta)?.area]).filter(([a, b]) => a && b && a !== b);
  for (const [a, b] of shared) if (!out.some(e => (e.x === a && e.y === b) || (e.x === b && e.y === a))) out.push({ x: a, y: b, d: 0, w: .3, txt: `Há tarefas de ${SHORT(a)} servindo a metas de ${SHORT(b)}.`, how: "metas", flow: true });
  return out;
}

function stage(R, E) {
  const W = 760, H = 640, cx = W / 2, cy = H / 2 - 4, rad = 228, n = AREAS.length;
  const pos = {}; AREAS.forEach((a, i) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / n; pos[a] = [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, ang]; });
  const sel = FOCUS, rel = e => !sel || e.x === sel || e.y === sel;
  let g = `<defs><radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--plan)" stop-opacity=".55"/><stop offset="100%" stop-color="var(--plan)" stop-opacity="0"/></radialGradient></defs>`;
  for (const r0 of [80, 160, 228, 290]) g += `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="none" stroke="var(--line)" stroke-dasharray="${r0 === 228 ? "0" : "2 6"}" opacity="${r0 === 228 ? .7 : .45}"/>`;
  // ligações
  E.forEach((e, i) => {
    const [x1, y1] = pos[e.x], [x2, y2] = pos[e.y]; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; const qx = cx + (mx - cx) * .25, qy = cy + (my - cy) * .25;
    const col = e.flow ? "var(--ink-2)" : e.d > 0 ? "var(--good)" : "var(--crit)";
    const on = rel(e), hot = EDGE === i;
    g += `<path d="M${x1},${y1} Q${qx},${qy} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${(1.2 + e.w * 5).toFixed(1)}" stroke-linecap="round" opacity="${hot ? 1 : on ? (sel ? .9 : .55) : .08}" ${e.flow ? 'stroke-dasharray="1 7"' : ""} class="edge ${e.flow ? "flow" : ""}" data-edge="${i}" ${tip(`${SHORT(e.x)} ↔ ${SHORT(e.y)} · ${e.how}: ${e.txt}`)}/>`;
  });
  // núcleo
  const idx = R.indice;
  g += `<circle cx="${cx}" cy="${cy}" r="120" fill="url(#core)" opacity=".5" class="pulse"/>`;
  const arc = (r, f, col, w) => { if (f == null) return ""; const c = 2 * Math.PI * r; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${(c * clamp(f)).toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`; };
  g += `<circle cx="${cx}" cy="${cy}" r="70" fill="var(--surface)" stroke="var(--line)"/>` + `<circle cx="${cx}" cy="${cy}" r="64" fill="none" stroke="var(--surface-2)" stroke-width="7"/>` + arc(64, idx == null ? null : idx / 100, "var(--plan)", 7) + arc(54, R.percep == null ? null : R.percep / 10, "var(--body)", 3);
  g += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="40" font-weight="700" fill="var(--ink)" font-family="var(--display)">${idx ?? "–"}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="9.5" fill="var(--muted)" letter-spacing="1.2">ÍNDICE</text><text x="${cx}" y="${cy + 35}" text-anchor="middle" font-size="10" fill="var(--body)">percepção ${R.percep == null ? "–" : num(R.percep)}</text>`;
  // nós
  R.areas.forEach(a => {
    const [x, y, ang] = pos[a.a], col = AREA_COLOR[a.a], r = 20 + (a.dados ?? 3) * 1.6, on = !sel || sel === a.a || E.some(e => (e.x === sel && e.y === a.a) || (e.y === sel && e.x === a.a));
    const st = { good: "var(--good)", warn: "var(--warn)", crit: "var(--crit)", none: "var(--muted)" }[a.st];
    const c = 2 * Math.PI * (r + 7), pf = a.perc == null ? 0 : a.perc / 10;
    const lx = cx + Math.cos(ang) * (rad + r + 30), ly = cy + Math.sin(ang) * (rad + r + 30), anc = Math.cos(ang) > .3 ? "start" : Math.cos(ang) < -.3 ? "end" : "middle";
    g += `<g class="node ${sel === a.a ? "sel" : ""}" data-node="${esc(a.a)}" tabindex="0" role="button" aria-label="${esc(a.a)}: dados ${a.dados ?? "sem dados"}, percepção ${a.perc ?? "sem nota"}" opacity="${on ? 1 : .28}" ${tip(`${a.a} · dados ${a.dados == null ? "–" : num(a.dados)} · percepção ${a.perc ?? "–"} · ${a.ind}`)}>
      <circle cx="${x}" cy="${y}" r="${r + 14}" fill="${col}" opacity="${sel === a.a ? .22 : .08}" class="halo"/>
      <circle cx="${x}" cy="${y}" r="${r + 7}" fill="none" stroke="var(--line)" stroke-width="3"/>
      <circle cx="${x}" cy="${y}" r="${r + 7}" fill="none" stroke="var(--plan)" stroke-width="3" stroke-dasharray="${(c * pf).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${x} ${y})" stroke-linecap="round"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--surface)" stroke="${col}" stroke-width="2.5"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${st}" opacity=".16"/>
      <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${r > 30 ? 15 : 13}" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${a.dados == null ? "–" : num(a.dados)}</text>
      <text x="${lx}" y="${ly + 4}" text-anchor="${anc}" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(SHORT(a.a))}</text>
      <text x="${lx}" y="${ly + 19}" text-anchor="${anc}" font-size="10.5" fill="var(--muted)">${a.perc == null ? "sem nota" : "sente " + a.perc}${a.alvo ? " · alvo " + a.alvo : ""}</text></g>`;
  });
  return `<svg class="stage" viewBox="0 0 ${W} ${H}" role="group" aria-label="Constelação das áreas da vida">${g}</svg>`;
}

function river(R, H) {
  const W = 1000, Hh = 120, L = 30, T = 14, iw = W - L * 2, ih = Hh - T - 26, n = H.length;
  const X = i => L + (n === 1 ? iw / 2 : i * iw / (n - 1)), Y = v => T + ih - v / 100 * ih;
  const has = h => h.diasReg > 0 || h.fin.rec + h.fin.desp > 0;
  const pts = H.map((h, i) => [i, has(h) ? h.indice : null]).filter(p => p[1] != null), pp = H.map((h, i) => [i, h.percep == null ? null : h.percep * 10]).filter(p => p[1] != null);
  let g = `<line x1="${L}" x2="${W - L}" y1="${Y(50)}" y2="${Y(50)}" stroke="var(--line)" stroke-dasharray="2 5"/>`;
  if (pts.length > 1) { const ln = pts.map(p => `${X(p[0])},${Y(p[1])}`).join(" "); g += `<polygon points="${X(pts[0][0])},${Y(0)} ${ln} ${X(pts.at(-1)[0])},${Y(0)}" fill="var(--plan)" opacity=".14"/><polyline points="${ln}" fill="none" stroke="var(--plan)" stroke-width="2.5"/>`; }
  if (pp.length > 1) g += `<polyline points="${pp.map(p => `${X(p[0])},${Y(p[1])}`).join(" ")}" fill="none" stroke="var(--body)" stroke-width="2" stroke-dasharray="4 4"/>`;
  H.forEach((h, i) => { const on = h.mk === REF;
    g += `<g class="mstop" data-month="${h.mk}" ${tip(has(h) ? `${mlabel(h.mk)} · índice ${h.indice ?? "–"} · resultado ${eur(h.fin.res)} · sono ${num(h.sono)} h` : `${mlabel(h.mk)} · sem registros`)}><rect x="${X(i) - iw / n / 2}" y="0" width="${iw / n}" height="${Hh}" fill="${on ? "var(--ink)" : "transparent"}" opacity="${on ? .07 : 1}" rx="8"/>
    ${has(h) && h.indice != null ? `<circle cx="${X(i)}" cy="${Y(h.indice)}" r="${on ? 6 : 3.5}" fill="${on ? "var(--plan)" : "var(--surface)"}" stroke="var(--plan)" stroke-width="2"/>` : ""}
    <text x="${X(i)}" y="${Hh - 6}" text-anchor="middle" font-size="11" font-weight="${on ? 700 : 500}" fill="${on ? "var(--ink)" : "var(--muted)"}">${mabbr(h.mk)}</text></g>`; });
  return `<svg class="riversvg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Índice de vida mês a mês">${g}</svg>`;
}

function dossier(R, H, E) {
  const a = R.areas.find(x => x.a === FOCUS); if (!a) return "";
  const hist = H.map(h => h.areas.find(x => x.a === FOCUS)?.dados ?? null), L = H.map(h => mabbr(h.mk));
  const metas = R.metas.filter(m => m.area === FOCUS && m.ativa && m.rt !== "Concluída");
  const habs = R.hab.filter(h => h.area === FOCUS), tars = R.tar.filter(t => t.area === FOCUS && t.open).sort((x, y) => (x.prazo || "9").localeCompare(y.prazo || "9")).slice(0, 4);
  const links = E.map((e, i) => ({ ...e, i })).filter(e => e.x === FOCUS || e.y === FOCUS).sort((x, y) => y.w - x.w);
  const days = []; for (let k = 13; k >= 0; k--) days.push(addDays(TODAY, -k));
  let special = "";
  if (FOCUS === "Finanças") special = lineChart(L, [{ name: "Receitas", color: "var(--plan)", data: H.map(h => h.fin.rec) }, { name: "Despesas", color: "var(--body)", data: H.map(h => h.fin.desp) }, { name: "Resultado", color: "var(--money)", data: H.map(h => h.fin.res), area: true }], { h: 190, w: 440, hi: H.length - 1, min: Math.min(0, ...H.map(h => h.fin.res)) });
  else if (FOCUS === "Saúde física") special = lineChart(L, [{ name: "Sono (h)", color: "var(--body)", data: H.map(h => h.sono), area: true }], { h: 170, w: 440, min: 4, max: 9, band: S.cfg.metaSono, hi: H.length - 1 });
  else if (FOCUS === "Saúde mental") special = `<div class="mt">Humor · 28 dias</div>${strip(R.days28, "humor", "div")}` + lineChart(L, [{ name: "Humor", color: "var(--body)", data: H.map(h => h.humor) }], { h: 150, w: 440, min: 1, max: 5, hi: H.length - 1 });
  else if (FOCUS === "Aprendizado" || FOCUS === "Carreira") special = lineChart(L, [{ name: "Estudo (h)", color: "var(--grow)", data: H.map(h => h.horasEst), area: true }], { h: 160, w: 440, hi: H.length - 1 }) + (FOCUS === "Carreira" ? `<div class="mt" style="margin-top:8px">Competências</div>${S.comp.map(c => `<div class="br"><span>${esc(c.nome)}</span><div class="bt"><i class="${c.atual >= c.alvo ? "good" : "warn"}" style="width:${clamp(c.atual / 5) * 100}%"></i><b style="left:${clamp(c.alvo / 5) * 100}%"></b></div><em>${c.atual}/${c.alvo}</em></div>`).join("")}` : "");
  else if (FOCUS === "Lazer & criatividade") special = lineChart(L, [{ name: "Lazer (h)", color: "var(--people)", data: H.map(h => h.horasLaz), area: true }], { h: 170, w: 440, hi: H.length - 1 });
  else if (["Família", "Amor & parceria", "Amizades & social"].includes(FOCUS)) { const relk = { "Família": "Família", "Amor & parceria": "Parceria", "Amizades & social": "Amizade" }[FOCUS];
    special = `<div class="list">${R.pes.filter(p => p.relacao === relk).sort((x, y) => y.ratio - x.ratio).map(p => `<div class="li"><div class="t">${esc(p.nome)}<div class="m">${p.ult ? `há ${p.dias} d · a cada ${p.freq}` : "sem registro"}${p.faltam != null && p.faltam <= 45 ? ` · aniversário em ${p.faltam} d` : ""}</div></div>${pill(p.st, p.txt)}</div>`).join("") || `<div class="empty">Ninguém cadastrado com essa relação.</div>`}</div>`; }
  else if (FOCUS === "Casa & organização") special = `<div class="list">${R.venc.slice(0, 6).map(v => `<div class="li"><div class="t">${esc(v.t)}<div class="m">${v.k}</div></div>${pill(v.dias < 0 ? "crit" : "warn", v.dias < 0 ? `venceu há ${-v.dias} d` : `em ${v.dias} d`)}</div>`).join("") || `<div class="empty">Nada vencendo.</div>`}</div>`;
  const gap = a.perc != null && a.dados != null ? a.perc - a.dados : null;
  return `<div class="dossier" style="--c:${AREA_COLOR[FOCUS]}">
    <div class="dh"><div><div class="eyebrow">Área em foco</div><h2>${esc(FOCUS)}</h2></div><button class="iconbtn" data-node="" aria-label="Fechar área">✕</button></div>
    <div class="trio"><div><span>Dados</span><b class="st-${a.st}">${a.dados == null ? "–" : num(a.dados)}</b></div><div><span>Você sente</span><b>${a.perc ?? "–"}</b></div><div><span>Alvo</span><b>${a.alvo ?? "–"}</b></div></div>
    ${gap != null && Math.abs(gap) >= 1.5 ? `<div class="callout ${gap > 0 ? "warn" : "good"}">${gap > 0 ? `Você se sente ${num(gap)} pontos melhor do que os registros mostram.` : `Os registros estão ${num(-gap)} pontos acima do que você sente.`}</div>` : ""}
    <div class="muted small">${esc(a.ind)}</div>
    <div class="mt" style="margin-top:12px">Placar nos últimos ${H.length} meses</div>${spark(hist, AREA_COLOR[FOCUS], { min: 0, max: 10 }).replace('class="spark"', 'class="spark wide"')}
    ${special ? `<div class="block">${special}</div>` : ""}
    <div class="block"><div class="mt">Conectada a</div>${links.length ? links.map(e => `<button class="link ${EDGE === e.i ? "on" : ""}" data-edge="${e.i}"><span class="ln ${e.flow ? "flow" : e.d > 0 ? "good" : "crit"}"></span><span><b>${esc(SHORT(e.x === FOCUS ? e.y : e.x))}</b> · ${esc(e.how)}<br><small>${esc(e.txt)}</small></span></button>`).join("") : `<div class="empty">Sem ligações fortes nos dados ainda.</div>`}</div>
    <div class="block"><div class="mt">Metas</div>${metas.length ? metas.map(m => `<div class="br click" data-edit="metas" data-id="${m.id}"><span>${esc(m.meta)}</span><div class="bt"><i class="${m.st}" style="width:${m.prog * 100}%"></i>${m.esp != null ? `<b style="left:${m.esp * 100}%"></b>` : ""}</div><em class="${m.st}">${pct(m.prog)}</em></div>`).join("") : `<div class="empty">Nenhuma meta ativa nesta área. <button class="lnkbtn" data-add="metas">Criar meta</button></div>`}</div>
    ${habs.length ? `<div class="block"><div class="mt">Hábitos · 14 dias</div>${habs.map(h => `<div class="hrow"><span>${esc(h.nome)}</span><div class="ticks">${days.map(d => `<button class="tick ${S.marks[h.id + "|" + d] ? "on" : ""}" data-mark="${h.id}|${d}" aria-label="${esc(h.nome)} ${fmtD(d)}" aria-pressed="${!!S.marks[h.id + "|" + d]}"></button>`).join("")}</div><em class="${h.st}">${pct(h.pm)}</em></div>`).join("")}</div>` : ""}
    ${tars.length ? `<div class="block"><div class="mt">Próximas tarefas</div><div class="list">${tars.map(t => `<div class="li click" data-edit="tarefas" data-id="${t.id}"><div class="t">${esc(t.tarefa)}<div class="m">${t.prazo ? fmtD(t.prazo) : "sem prazo"}</div></div>${pill(t.st, t.al)}</div>`).join("")}</div></div>` : ""}
    <a class="btn wide" href="#${AREA_PAGE[FOCUS]}">Abrir módulo completo →</a>
  </div>`;
}

function overview(R, H) {
  const P = H.at(-2), F = R.fin, ins = insights(R, H);
  const k = (c, l, v, dl, sp) => `<div class="ok" style="--c:${c}"><span>${l}</span><b>${v}</b>${dl}${sp}</div>`;
  const W = H.slice(-PER);
  return `<div class="dossier">
    <div class="dh"><div><div class="eyebrow">${esc(mlabel(R.mk))}</div><h2>${S.cfg.nome ? "Olá, " + esc(S.cfg.nome) : "Sua constelação"}</h2></div></div>
    <p class="muted small" style="margin-top:-4px">Cada esfera é uma área da vida: o número é o placar dos dados, o anel azul é o quanto você sente. As linhas ligam áreas que se influenciam nos seus registros. Clique em uma para abrir o dossiê.</p>
    <div class="okgrid">
      ${k("var(--money)", "Resultado", eur(F.res), delta(F.res, P?.fin.res, { fmt: v => eur(v) }), spark(W.map(h => h.fin.res), "var(--money)"))}
      ${k("var(--money)", "Poupança", pct(F.taxa), delta(F.taxa == null ? null : F.taxa * 100, P?.fin.taxa == null ? null : P.fin.taxa * 100, { fmt: v => num(v, 0), unit: " pp" }), spark(W.map(h => h.fin.taxa), "var(--money)"))}
      ${k("var(--body)", "Sono", R.sono == null ? "–" : num(R.sono) + " h", delta(R.sono, P?.sono, { unit: " h" }), spark(W.map(h => h.sono), "var(--body)"))}
      ${k("var(--body)", "Humor", R.humor == null ? "–" : num(R.humor), delta(R.humor, P?.humor), spark(W.map(h => h.humor), "var(--body)", { min: 1, max: 5 }))}
      ${k("var(--body)", "Hábitos", pct(R.habMeta), delta(R.habMeta == null ? null : R.habMeta * 100, P?.habMeta == null ? null : P.habMeta * 100, { fmt: v => num(v, 0), unit: " pp" }), spark(W.map(h => h.habMeta), "var(--body)", { min: 0, max: 1 }))}
      ${k("var(--plan)", "Metas no ritmo", R.metasAnd ? `${R.metasRitmo}/${R.metasAnd}` : "–", `<span class="dl ${R.metasAtras ? "crit" : "good"}">${R.metasAtras} em risco</span>`, "")}
    </div>
    <div class="block"><div class="mt">O que os dados estão dizendo</div>${ins.length ? ins.slice(0, 4).map(i => `<div class="insight ${i.st}"><div class="ik">${esc(i.k)}</div><p>${i.t}</p><div class="ia">→ ${esc(i.a)}</div></div>`).join("") : `<div class="empty">Registre duas semanas de check-ins para ver conexões.</div>`}</div>
    <div class="block"><div class="mt">Fila de ação</div><div class="list">${[...R.tar.filter(t => t.open && (t.st === "crit" || t.st === "warn")).slice(0, 4).map(t => `<div class="li click" data-edit="tarefas" data-id="${t.id}"><div class="t">${esc(t.tarefa)}<div class="m">${fmtD(t.prazo)} · tarefa</div></div>${pill(t.st, t.al)}</div>`),
      ...R.pes.filter(p => p.st === "crit").slice(0, 2).map(p => `<div class="li"><div class="t">${esc(p.nome)}<div class="m">contato · ${p.ult ? "há " + p.dias + " d" : "nunca"}</div></div>${pill("crit", "Ligar")}</div>`),
      ...R.venc.filter(v => v.dias <= 7).slice(0, 3).map(v => `<div class="li"><div class="t">${esc(v.t)}<div class="m">${v.k}</div></div>${pill(v.dias < 0 ? "crit" : "warn", v.dias < 0 ? "atrasado" : "em " + v.dias + " d")}</div>`)].join("") || `<div class="empty">Nada urgente.</div>`}</div></div>
    <div class="block"><div class="mt">Foco do mês</div><div class="reflect ${R.foco ? "" : "ph"}">${esc(R.foco || "Defina na revisão mensal.")}</div>
      <div class="prio" style="margin-top:10px">${[0, 1, 2].map(i => `<label for="prio${i}">${i + 1}<input id="prio${i}" type="text" data-prio="${i}" value="${esc(S.prio[i] || "")}" placeholder="Prioridade da semana"></label>`).join("")}</div></div>
  </div>`;
}

function pConstelacao(R) {
  const H = history(12), E = edges(R);
  return `<div class="cosmos">
    <section class="stagewrap" aria-label="Rede das áreas">
      <div class="stagebar"><div class="chips">${[3, 6, 12].map(n => `<button class="chip" data-per="${n}" aria-pressed="${PER === n}">${n} meses</button>`).join("")}</div>
        <div class="leg"><span><i class="ln good"></i>melhora</span><span><i class="ln crit"></i>piora</span><span><i class="ln flow"></i>dinheiro / tempo</span><span><i class="ring"></i>anel = percepção</span></div></div>
      ${stage(R, E)}
      ${EDGE != null && E[EDGE] ? `<div class="edgecard"><b>${esc(SHORT(E[EDGE].x))} ↔ ${esc(SHORT(E[EDGE].y))}</b> · ${esc(E[EDGE].how)}<p>${esc(E[EDGE].txt)}</p><button class="iconbtn" data-edge="" aria-label="Fechar ligação">✕</button></div>` : ""}
    </section>
    <aside class="side2">${FOCUS ? dossier(R, H, E) : overview(R, H)}</aside>
    <section class="river"><div class="rh"><div><div class="eyebrow">Rio do tempo</div><b>Índice de vida mês a mês</b> <span class="muted small">· linha cheia = dados · tracejada = percepção ×10 · clique num mês para viajar até ele</span></div>
      <div class="rstrips"><div><span class="mt">Humor 28 d</span>${strip(R.days28, "humor", "div")}</div><div><span class="mt">Hábitos 28 d</span>${strip(R.days28, "hab", "seq")}</div></div></div>${river(R, H)}</section>
  </div>`;
}

/* ============================================================ render */
function render() {
  const R = calc();
  const IC = { painel: "✦", roda: "Rd", metas: "Mt", tarefas: "Tf", financas: "€", saude: "Sa", habitos: "Hb", carreira: "Cr", aprendizado: "Ap", relacoes: "Rl", lazer: "Lz", casa: "Cs", config: "⚙" };
  $("#nav").innerHTML = `<div class="brandmark" aria-hidden="true">CV</div>` + PAGES.map(([k, l, c, g], i) => (g && i ? `<div class="sep"></div>` : "") + `<a href="#${k}" style="--c:${c}" ${k === PAGE ? 'aria-current="page"' : ""} aria-label="${l}"><span class="ic">${IC[k]}</span><span class="lbl">${l}</span></a>`).join("");
  const title = PAGES.find(p => p[0] === PAGE)[1];
  const banner = IS_EXAMPLE && LOADED ? `<div class="banner"><span><b>Dados de exemplo.</b> São fictícios, para você ver tudo funcionando. Ao editar qualquer coisa, eles viram seus e passam a ser salvos.</span><button class="btn primary" id="startEmpty">Começar com tudo vazio</button></div>` : "";
  const body = { painel: pConstelacao, roda: pRoda, metas: pMetas, tarefas: pTarefas, financas: pFinancas, saude: pSaude, habitos: pHabitos, carreira: pCarreira, aprendizado: pAprend, relacoes: pRelacoes, lazer: pLazer, casa: pCasa, config: pConfig }[PAGE](R);
  const focusId = document.activeElement?.id, selS = document.activeElement?.selectionStart;
  $("#main").innerHTML = `<div class="topbar ${PAGE === "painel" ? "slim" : ""}"><div><h1>${PAGE === "painel" ? "Constelação da Vida" : title}</h1><div class="sub">${PAGE === "painel" ? `Visão integrada de ${mlabel(REF)} · dados até ${R.corte ? fmtD(R.corte) : "–"}` : mlabel(REF)} <span class="saving">${LOADED ? "" : "· carregando seus dados…"}</span></div></div>
    <div class="monthpick" aria-label="Mês de referência"><button id="mPrev" aria-label="Mês anterior">‹</button><span>${mlabel(REF)}</span><button id="mNext" aria-label="Próximo mês">›</button><button id="mNow" style="width:auto;padding:0 8px;font-size:12px;font-weight:600">Hoje</button></div></div>${banner}${body}`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch {} } }
}

/* ============================================================ eventos */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-edit],[data-day],[data-node],[data-edge],[data-month]"); if (!t) return;
  if (t.dataset.node != null && !t.dataset.mark) { FOCUS = !t.dataset.node || FOCUS === t.dataset.node ? null : t.dataset.node; EDGE = null; render(); return; }
  if (t.dataset.edge != null) { EDGE = t.dataset.edge === "" || EDGE === +t.dataset.edge ? null : +t.dataset.edge; render(); return; }
  if (t.dataset.month) { REF = t.dataset.month; render(); return; }
  if (t.id === "mPrev") { REF = addMonth(REF, -1); render(); } else if (t.id === "mNext") { REF = addMonth(REF, 1); render(); } else if (t.id === "mNow") { REF = mkey(TODAY); render(); }
  else if (t.id === "startEmpty" || t.id === "wipe") { if (t.id === "wipe" && !t.dataset.c) { t.dataset.c = 1; t.textContent = "Confirmar: apagar tudo"; return; } S = EMPTY(); MEMO = null; IS_EXAMPLE = false; KEYS.forEach(k => dirty.add(k)); flush(); render(); toast("Tudo vazio. Comece por Ajustes e Metas."); }
  else if (t.id === "loadEx") { S = exampleData(); IS_EXAMPLE = true; MEMO = null; render(); toast("Exemplo carregado (não salvo)"); }
  else if (t.dataset.per) { PER = +t.dataset.per; render(); }
  else if (t.dataset.area != null) { AREA = !t.dataset.area || AREA === t.dataset.area ? null : t.dataset.area; render(); }
  else if (t.dataset.q != null) { QTAB = +t.dataset.q; render(); }
  else if (t.dataset.add) openForm(t.dataset.add);
  else if (t.dataset.edit) openForm(t.dataset.edit, t.dataset.id);
  else if (t.dataset.mark) { const k = t.dataset.mark; if (S.marks[k]) delete S.marks[k]; else S.marks[k] = 1; touch("marks"); }
  else if (t.dataset.done) { S.rotinas = S.rotinas.map(r => r.id === t.dataset.done ? { ...r, ultima: TODAY } : r); touch("rotinas"); toast("Rotina registrada hoje"); }
  else if (t.dataset.sd) { const d = checkin || TODAY; S.saude[d] = { ...(S.saude[d] || {}), [t.dataset.sd]: +t.dataset.v }; touch("saude"); }
  else if (t.dataset.day) { checkin = t.dataset.day; render(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("tr.click,.node")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } if (e.key === "Escape" && (FOCUS || EDGE != null)) { FOCUS = null; EDGE = null; render(); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.roda != null) { S.roda[REF] = { ...(S.roda[REF] || {}), [t.dataset.roda]: +t.value }; t.nextElementSibling.textContent = t.value; }
});
document.addEventListener("change", e => {
  const t = e.target, v = t.value;
  if (t.dataset.roda != null) touch("roda");
  else if (t.dataset.prio != null) { S.prio[+t.dataset.prio] = v; touch("prio"); }
  else if (t.dataset.alvo != null) { S.alvo[t.dataset.alvo] = v === "" ? null : +v; touch("alvo"); }
  else if (t.dataset.rev) { S.revisao[REF] = { ...(S.revisao[REF] || {}), [t.dataset.rev]: t.dataset.rev === "nota" ? +v : v }; touch("revisao"); }
  else if (t.dataset.orc) { if (v === "") delete S.orc[t.dataset.orc]; else S.orc[t.dataset.orc] = +v; touch("orc"); }
  else if (t.dataset.patr) { S.patr[REF] = { ...(S.patr[REF] || {}), [t.dataset.patr]: v === "" ? "" : +v }; touch("patr"); }
  else if (t.dataset.cfg) { S.cfg[t.dataset.cfg] = t.type === "number" ? +v : v; touch("cfg"); }
  else if (t.dataset.sdi) { const d = checkin || TODAY; const val = t.type === "number" ? (v === "" ? null : +v) : v; S.saude[d] = { ...(S.saude[d] || {}), [t.dataset.sdi]: val }; touch("saude"); }
  else if (t.id === "fArea") { AREA = v || null; render(); }
  else if (t.id === "ck_day") { checkin = v || TODAY; render(); }
});
document.addEventListener("mouseover", e => { const el = e.target.closest?.("[data-tip]"), tp = $("#tip"); if (!el) { tp.hidden = true; return; } tp.textContent = el.dataset.tip; tp.hidden = false; });
document.addEventListener("mousemove", e => { const tp = $("#tip"); if (tp.hidden) return; const x = Math.min(e.clientX + 14, innerWidth - tp.offsetWidth - 8); tp.style.left = x + "px"; tp.style.top = (e.clientY + 16) + "px"; });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGES.some(p => p[0] === h)) { PAGE = h; checkin = null; render(); $("#main").focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } });

/* ============================================================ inicialização */
S = exampleData(); REF = addMonth(mkey(TODAY), -1); render();
(async () => {
  let loaded = {};
  try {
    const db = await window.claude?.use?.("db"), user = db ? await window.claude.use("user") : null;
    const id = user ? await user.id() : null;
    if (db && id) {
      const col = db.collection("data/users/" + id); STORE = { kind: "db", col };
      const snap = await col.get(); for (const d of snap.docs) if (d.id.startsWith("s_")) loaded[d.id.slice(2)] = d.data()?.v;
    }
  } catch (e) { STORE = null; }
  if (!STORE) { STORE = { kind: "local" }; for (const k of KEYS) try { const v = localStorage.getItem("pv_" + k); if (v) loaded[k] = JSON.parse(v); } catch {} }
  if (Object.keys(loaded).length) { const E = EMPTY(); S = { ...E, ...loaded, cfg: { ...E.cfg, ...(loaded.cfg || {}) } }; IS_EXAMPLE = false; REF = mkey(TODAY); }
  LOADED = true; MEMO = null; render();
})();
</script>
