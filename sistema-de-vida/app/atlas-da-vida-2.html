  const over = R.orcCats.filter(c => c.st === "crit").sort((a, b) => b.p - a.p);
  if (over.length) out.push({ w: 1.2 + over.length * .15, st: "crit", area: "Finanças", k: "Orçamento estourado", t: `${over.length === 1 ? "Uma categoria passou" : over.length + " categorias passaram"} do teto: ${over.slice(0, 3).map(c => `<b>${esc(c.cat)}</b> (${pct(c.p)})`).join(", ")}.`, a: "Ajuste o teto ou compense em outra categoria ainda este mês." });
  if (R.fin.taxa != null) { const ok = R.fin.taxa >= C.metaPoup; out.push({ w: ok ? .45 : 1.1, st: ok ? "good" : "warn", area: "Finanças", k: "Taxa de poupança", t: `Você guardou <b>${pct(R.fin.taxa)}</b> da receita em ${mlabel(R.mk)}; a meta é ${pct(C.metaPoup)}.`, a: ok ? "Direcione o excedente para a meta financeira mais próxima." : `Faltaram ${eur((C.metaPoup - R.fin.taxa) * R.fin.rec)} para bater a meta.` }); }
  if (R.economia > 0) out.push({ w: .7, st: "warn", area: "Finanças", k: "Assinaturas pouco usadas", t: `<b>${eur(R.economia, 2)}/mês</b> vão para serviços que você marcou como pouco usados.`, a: "Cancele ou pause um deles esta semana." });
  if (R.reserva != null && R.reserva < C.metaReserva) out.push({ w: .55, st: "warn", area: "Finanças", k: "Reserva de emergência", t: `A reserva cobre <b>${num(R.reserva)} meses</b> de despesas; a meta é ${C.metaReserva}.`, a: "Mantenha o aporte automático logo depois de receber." });
  const late = R.pes.filter(p => p.st === "crit" && +p.freq).sort((a, b) => b.ratio - a.ratio);
  if (late.length) out.push({ w: .9 + late.length * .1, st: "warn", area: relArea(late[0].relacao), k: "Contato atrasado", t: `${late.slice(0, 3).map(p => `<b>${esc(p.nome)}</b> (${p.ult ? p.dias + " dias" : "nunca"})`).join(", ")} ${late.length > 1 ? "passaram" : "passou"} da frequência que você definiu.`, a: "Uma mensagem curta hoje já reinicia a contagem." });
  const dc = R.docs.filter(d => d.st === "crit" || (d.st === "warn" && d.dias <= 60)).sort((a, b) => a.dias - b.dias);
  if (dc.length) out.push({ w: dc[0].st === "crit" ? 1.6 : 1, st: dc[0].st === "crit" ? "crit" : "warn", area: "Casa & organização", k: "Documentos", t: dc.slice(0, 2).map(d => `<b>${esc(d.doc)}</b> ${d.dias < 0 ? "venceu" : `vence em ${d.dias} dias`}`).join("; ") + ".", a: dc[0].acao ? `Próxima ação: ${dc[0].acao}.` : "Agende a renovação agora." });
  if (R.DR && S.estudo.length) { const meta = C.metaEstudo * R.DR / dim(R.mk); if (meta) out.push(R.horasEst < meta * .8 ? { w: .7, st: "warn", area: "Aprendizado", k: "Estudo abaixo do ritmo", t: `<b>${num(R.horasEst)} h</b> de estudo no período, para ${num(meta)} h esperadas pela meta mensal.`, a: "Bloqueie duas sessões fixas na agenda desta semana." } : { w: .35, st: "good", area: "Aprendizado", k: "Estudo em dia", t: `<b>${num(R.horasEst)} h</b> de estudo, acima do ritmo da meta (${num(meta)} h).`, a: "Mantenha os blocos fixos que estão funcionando." }); }
  const ca = S.cand.filter(c => c.dataAcao && c.dataAcao < TODAY && !["Aceito", "Recusado", "Desisti"].includes(c.etapa));
  if (ca.length) out.push({ w: .9, st: "warn", area: "Carreira", k: "Candidaturas paradas", t: `${ca.map(c => `<b>${esc(c.empresa)}</b>`).join(", ")}: a próxima ação passou do prazo.`, a: "Um follow-up curto mantém a candidatura viva." });
  if (R.DR && S.lazer.length) { const m = C.metaLazer * R.DR / 7; if (R.horasLaz < m * .7) out.push({ w: .6, st: "warn", area: "Lazer & criatividade", k: "Pouco lazer", t: `<b>${num(R.horasLaz)} h</b> de lazer no mês, abaixo das ${num(m, 0)} h da sua meta.`, a: "Agende algo prazeroso como se fosse compromisso." }); else if (R.lazSat != null) out.push({ w: .3, st: "good", area: "Lazer & criatividade", k: "Lazer em dia", t: `<b>${num(R.horasLaz)} h</b> de lazer com satisfação média de ${num(R.lazSat)}/5.`, a: "Repita o que teve nota mais alta." }); }
  if (R.sono != null && R.sono < C.metaSono - .3) out.push({ w: .8, st: "warn", area: "Saúde física", k: "Sono abaixo da meta", t: `Média de <b>${num(R.sono)} h</b> por noite, para uma meta de ${num(C.metaSono)} h.`, a: "Antecipe o horário de dormir em 20 minutos por uma semana." });
  const ph = R.hab.find(h => h.area === "Propósito & espiritualidade" && h.pm != null);
  if (ph) out.push({ w: .45, st: ph.st === "good" ? "good" : "warn", area: "Propósito & espiritualidade", k: ph.nome, t: `<b>${pct(ph.pm)}</b> da meta de “${esc(ph.nome)}” no mês.`, a: ph.st === "good" ? "Bom ritmo; registre no diário o que essa prática tem trazido." : "Reduza a meta semanal para algo que caiba na rotina." });
  return out.sort((a, b) => b.w - a.w);
}


/* ================================================================ gráficos SVG (tokens do tema; nada de cor literal) */
let GID = 0;
const tip = t => `data-tip="${esc(t)}"`;
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].map(m => m * e).find(m => m >= v); }
function niceScale(min, max, n = 4, minStep = 0) {
  if (!isFinite(min)) min = 0; if (!isFinite(max)) max = 1; if (max - min < 1e-9) { max = min + (Math.abs(min) || 1); }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = Math.max(minStep, (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag);
  const lo = Math.floor(min / step + 1e-9) * step, hi = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, ticks };
}
const linTicks = (lo, hi, n = 4) => Array.from({ length: n + 1 }, (_, i) => lo + (hi - lo) * i / n);
function smoothPath(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
const linePath = pts => pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
const svgWrap = (W, H, g, label = "", cls = "chart") => `<svg class="${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
const legend = items => `<div class="legend">${items.map(s => `<span><i style="background:${s.color}"${s.dash ? ' class="dash"' : ""}></i>${esc(s.name)}</span>`).join("")}</div>`;
const emptyChart = (t = "Sem dados no período.") => `<div class="empty">${esc(t)}</div>`;

function spark(vals, color, { min = null, max = null, w = 120, h = 34 } = {}) {
  const pts = vals.map((v, i) => [i, v]).filter(p => isNum(p[1]));
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"></svg>`;
  const lo = min ?? Math.min(...pts.map(p => p[1])), hi = max ?? Math.max(...pts.map(p => p[1])), rg = hi - lo || 1;
  const X = i => 2 + i * (w - 4) / Math.max(1, vals.length - 1), Y = v => h - 3 - (v - lo) / rg * (h - 8);
  const P = pts.map(p => [X(p[0]), Y(p[1])]), d = smoothPath(P), id = "sg" + (++GID), last = P.at(-1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${last[0].toFixed(1)},${h} L${P[0][0].toFixed(1)},${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* linhas/áreas com eixo duplo, meta, projeção e colunas de hover (tooltip com todas as séries) */
function lineChart(labels, series, o = {}) {
  const W = o.w || 640, H = o.h || 240, L = o.left ?? 46, Rr = o.right ? 50 : 16, B = 26, T = 14, iw = W - L - Rr, ih = H - B - T;
  const n = labels.length + (o.proj || 0);
  if (!labels.length || !series.some(s => s.data.some(isNum))) return emptyChart(o.empty);
  const left = series.filter(s => !s.right), vals = left.flatMap(s => [...s.data, ...(s.proj || [])]).filter(isNum);
  if (o.target != null) vals.push(o.target);
  let lo, hi, ticks;
  if (o.min != null && o.max != null) { lo = o.min; hi = o.max; ticks = linTicks(lo, hi, 4); }
  else { const sc = niceScale(o.min ?? (o.zero === false ? Math.min(...vals) : Math.min(0, ...vals)), o.max ?? Math.max(...vals), 4); lo = sc.lo; hi = sc.hi; ticks = sc.ticks; }
  const X = i => L + (n <= 1 ? iw / 2 : i * iw / (n - 1)), Y = v => T + ih - (v - lo) / ((hi - lo) || 1) * ih;
  const rlo = o.right?.min || 0, rhi = o.right?.max || 1, YR = v => T + ih - (v - rlo) / ((rhi - rlo) || 1) * ih;
  const fmt = o.fmt || (v => num(v, 0));
  let g = "<defs>" + series.map((s, k) => `<linearGradient id="lg${GID + k + 1}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${s.fillOp ?? .28}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join("") + "</defs>";
  const g0 = GID; GID += series.length;
  for (const t of ticks) { const y = Y(t); g += `<line x1="${L}" x2="${W - Rr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L - 8}" y="${(y + 3.5).toFixed(1)}" class="ax" text-anchor="end">${esc(fmt(t))}</text>`; }
  if (o.right) linTicks(rlo, rhi, 4).forEach(t => g += `<text x="${W - Rr + 8}" y="${(YR(t) + 3.5).toFixed(1)}" class="ax">${esc(o.right.fmt(t))}</text>`);
  if (o.proj) { const x0 = X(labels.length - 1); g += `<rect x="${x0}" y="${T}" width="${W - Rr - x0}" height="${ih}" class="projbg"/><line x1="${x0}" x2="${x0}" y1="${T}" y2="${T + ih}" class="projln"/>`; }
  if (o.target != null) { const y = Y(o.target); g += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" class="tgt"/><text x="${L + 6}" y="${y - 5}" class="ax tgtx">${esc(o.targetLabel || "meta")}</text>`; }
  if (o.band) { const [a, b] = o.band; g += `<rect x="${L}" y="${Y(b)}" width="${iw}" height="${Math.max(0, Y(a) - Y(b))}" class="band"/>`; }
  const all = [...labels, ...(o.projLabels || [])], step = Math.ceil(all.length / (o.maxLabels || 12));
  all.forEach((lb, i) => { if (i % step && !(i === all.length - 1 && i % step >= step * .6)) return; g += `<text x="${X(i).toFixed(1)}" y="${H - 7}" class="ax${i >= labels.length ? " pj" : ""}${i === o.hi ? " hi" : ""}" text-anchor="middle">${esc(lb)}</text>`; });
  if (o.hi != null && o.hi >= 0) g += `<line x1="${X(o.hi)}" x2="${X(o.hi)}" y1="${T}" y2="${T + ih}" class="hiln"/>`;
  series.forEach((s, k) => {
    const Yf = s.right ? YR : Y, P = s.data.map((v, i) => isNum(v) ? [X(i), Yf(+v)] : null).filter(Boolean);
    if (!P.length) return;
    const segs = []; let cur = []; s.data.forEach((v, i) => { if (isNum(v)) cur.push([X(i), Yf(+v)]); else if (cur.length) { segs.push(cur); cur = []; } }); if (cur.length) segs.push(cur);
    for (const sg of segs) {
      const d = o.smooth === false || s.step ? linePath(sg) : smoothPath(sg);
      if (s.fill !== false && sg.length > 1) g += `<path d="${d} L${sg.at(-1)[0].toFixed(1)},${T + ih} L${sg[0][0].toFixed(1)},${T + ih}Z" fill="url(#lg${g0 + k + 1})"${s.faded ? ' opacity=".35"' : ""}/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.2}" stroke-linecap="round" stroke-linejoin="round"${s.dash ? ' stroke-dasharray="5 5"' : ""}${s.faded ? ' opacity=".22"' : s.op != null ? ` opacity="${s.op}"` : ""}/>`;
    }
    if ((s.dots ?? n <= 26) && !s.faded) g += s.data.map((v, i) => isNum(v) ? `<circle cx="${X(i).toFixed(1)}" cy="${Yf(+v).toFixed(1)}" r="${i === o.hi ? 4.2 : 3}" fill="${s.color}" class="dot"/>` : "").join("");
    if (s.proj?.length) { const pp = [P.at(-1), ...s.proj.map((v, i) => [X(labels.length + i), Yf(v)])]; g += `<path d="${smoothPath(pp)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="5 5"/>` + s.proj.map((v, i) => `<circle cx="${X(labels.length + i)}" cy="${Yf(v)}" r="3.6" class="pdot" stroke="${s.color}"/>`).join(""); }
  });

    const lines = [lb, ...series.filter(s => isNum(s.data[i])).map(s => `${s.name}: ${s.right ? o.right.fmt(+s.data[i]) : (s.fmt || fmt)(+s.data[i])}`)];
    const key = o.keys?.[i];
    g += `<rect class="hov${key != null && o.click ? " click" : ""}" x="${(X(i) - cw / 2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ih}" ${tip(lines.join("\n"))}${key != null && o.click ? ` data-${o.click}="${esc(key)}"` : ""}/>`;
  });
  const leg = o.legend === false ? "" : legend([...series.filter(s => !s.noLegend), ...(o.proj ? [{ name: "Tendência projetada", color: "var(--muted)", dash: true }] : [])]);
  return leg + svgWrap(W, H, g, o.label || series.map(s => s.name).join(", "));
}

/* colunas agrupadas ou empilhadas, com linha sobreposta (combo) e filtro cruzado */
function colChart(labels, series, o = {}) {
  const W = o.w || 640, H = o.h || 240, L = o.left ?? 50, Rr = 14, B = 26, T = 14, iw = W - L - Rr, ih = H - B - T, n = labels.length;
  if (!n || !series.some(s => s.data.some(v => +v))) return emptyChart(o.empty);
  const tot = labels.map((_, i) => o.stacked ? sum(series.map(s => Math.max(0, +s.data[i] || 0))) : Math.max(0, ...series.map(s => +s.data[i] || 0)));
  const lv = (o.line || []).flatMap(s => s.data).filter(isNum);
  const ints = series.every(s => s.data.every(v => v == null || Number.isInteger(+v))), sc = niceScale(0, Math.max(...tot, ...lv, o.target || 0, 1e-9), 4, ints ? 1 : 0), Y = v => T + ih - v / sc.hi * ih, fmt = o.fmt || (v => num(v, 0));
  const gw = iw / n, bw = o.stacked ? Math.min(36, gw * .62) : Math.min(18, gw * .74 / series.length);
  let g = "";
  for (const t of sc.ticks) { const y = Y(t); g += `<line x1="${L}" x2="${W - Rr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L - 8}" y="${(y + 3.5).toFixed(1)}" class="ax" text-anchor="end">${esc(fmt(t))}</text>`; }
  const step = Math.ceil(n / (o.maxLabels || 14));
  labels.forEach((lb, i) => {
    const key = o.keys?.[i], dim_ = (o.sel != null && key !== o.sel) || (o.hi != null && o.hi >= 0 && o.hi !== i && o.dimOthers);
    const x0 = L + i * gw + (gw - (o.stacked ? bw : bw * series.length)) / 2; let acc = 0;
    series.forEach((s, j) => {
      const v = Math.max(0, +s.data[i] || 0); if (!v) return;
      const h = ih * v / sc.hi, x = o.stacked ? x0 : x0 + j * bw, y = o.stacked ? Y(acc + v) : Y(v);
      g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, (o.stacked ? bw : bw - 2)).toFixed(1)}" height="${Math.max(.5, h).toFixed(1)}" rx="${o.stacked ? 1.5 : 3}" fill="${s.color}"${dim_ ? ' opacity=".35"' : ""}/>`;
      acc += v;
    });
    if (i % step === 0 || (i === n - 1 && i % step >= step * .6)) g += `<text x="${(L + i * gw + gw / 2).toFixed(1)}" y="${H - 7}" class="ax${i === o.hi || (o.sel != null && key === o.sel) ? " hi" : ""}" text-anchor="middle">${esc(lb)}</text>`;
  });
  for (const s of o.line || []) { const P = s.data.map((v, i) => isNum(v) ? [L + i * gw + gw / 2, Y(+v)] : null).filter(Boolean); if (P.length > 1) g += `<path d="${smoothPath(P)}" fill="none" stroke="${s.color}" stroke-width="2.2"${s.dash ? ' stroke-dasharray="5 4"' : ""}/>`; g += P.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}" class="dot"/>`).join(""); }
  if (o.target != null) { const y = Y(o.target); g += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" class="tgt"/><text x="${L + 6}" y="${y - 5}" class="ax tgtx">${esc(o.targetLabel || "meta")}</text>`; }
  labels.forEach((lb, i) => {
    const key = o.keys?.[i], lines = [lb, ...series.filter(s => +s.data[i]).map(s => `${s.name}: ${fmt(+s.data[i])}`), ...(o.line || []).filter(s => isNum(s.data[i])).map(s => `${s.name}: ${(s.fmt || fmt)(+s.data[i])}`)];
    if (o.stacked && series.length > 1) lines.splice(1, 0, `Total: ${fmt(tot[i])}`);
    g += `<rect class="hov${key != null && o.click ? " click" : ""}" x="${(L + i * gw).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ih}" ${tip(lines.join("\n"))}${key != null && o.click ? ` data-${o.click}="${esc(key)}"` : ""}/>`;
  });
  const leg = o.legend === false ? "" : legend([...series, ...(o.line || [])].filter(s => !s.noLegend));
  return leg + svgWrap(W, H, g, o.label || "");
}

/* barras horizontais em HTML (rótulos longos quebram bem em telas estreitas) */
function hbars(rows, o = {}) {
  if (!rows.length) return emptyChart(o.empty);
  const mx = o.max ?? Math.max(...rows.map(r => Math.abs(r.v)), 1e-9), fmt = o.fmt || (v => num(v));
  return `<div class="hb">${rows.map(r => { const key = r.key ?? r.l, sel = o.sel != null && o.sel !== key;
    return `<div class="hbr${o.xf ? " click" : ""}${sel ? " dim" : ""}"${o.xf ? ` data-xf="${o.xf}|${esc(key)}" role="button" tabindex="0"` : ""} ${tip(r.tip || `${r.l}: ${r.txt ?? fmt(r.v)}`)}><span class="hbl">${esc(r.l)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</span><div class="hbt"><i style="width:${(clamp(Math.abs(r.v) / mx) * 100).toFixed(1)}%;background:${r.color || o.color || "var(--accent)"}"></i>${r.mark != null ? `<b style="left:${(clamp(r.mark / mx) * 100).toFixed(1)}%"></b>` : ""}</div><em class="${r.st ? "st-" + r.st : ""}">${r.txt ?? esc(fmt(r.v))}</em></div>`; }).join("")}</div>`;
}
/* real × orçamento com marcador do ritmo do mês */
function bullet(rows, o = {}) {

function mdInline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n"); let h = "", list = null;
  const close = () => { if (list) { h += `</${list}>`; list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^\s*#{1,4}\s+(.*)/))) { close(); h += `<h4>${mdInline(m[1])}</h4>`; }
    else if ((m = ln.match(/^\s*[-*•]\s+\[( |x|X)\]\s+(.*)/))) { if (list !== "ul") { close(); h += "<ul>"; list = "ul"; } h += `<li class="ckli${m[1].trim() ? " done" : ""}">${mdInline(m[2])}</li>`; }
    else if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); h += "<ul>"; list = "ul"; } h += `<li>${mdInline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); h += "<ol>"; list = "ol"; } h += `<li>${mdInline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*>\s?(.*)/))) { close(); h += `<blockquote>${mdInline(m[1])}</blockquote>`; }
    else if (!ln.trim()) close();
    else { close(); h += `<p>${mdInline(ln)}</p>`; }
  }
  close(); return h;
}

  const P = calcAt(addMonth(REF, -1));
  const rows = R.areas.map((a, i) => ({ ...a, pv: P.areas[i].dados, ser: H.map(h => h.areas[i].dados) }));
  const tbl = `<div class="hscroll"><table class="dt sc"><thead><tr><th>Área</th><th class="num">Dados</th><th class="num">vs ant.</th><th class="num opt">Sente</th><th class="num opt">Alvo</th><th class="opt2">Tendência</th><th class="num opt">Peso</th><th><span class="sr">Mentor</span></th></tr></thead><tbody>${rows.map(a => `<tr class="click${f.area === a.a ? " sel" : ""}${f.area && f.area !== a.a ? " dim" : ""}" data-xf="area|${esc(a.a)}" tabindex="0"><td>${areaDot(a.a)}${esc(ashort(a.a))}</td><td class="num"><span class="sbar st-${a.st}" style="--v:${(a.dados ?? 0) * 10}%;--c:${acol(a.a)}">${a.dados == null ? "–" : num(a.dados)}</span></td><td class="num">${isNum(a.dados) && isNum(a.pv) ? `<span class="${a.dados >= a.pv ? "st-good" : "st-crit"}">${sgn(a.dados - a.pv)}</span>` : "–"}</td><td class="num opt">${a.perc ?? "–"}</td><td class="num opt">${a.alvo ?? "–"}</td><td class="opt2 sparkc">${spark(a.ser, acol(a.a), { min: 0, max: 10, w: 90, h: 24 })}</td><td class="num opt">${apeso(a.a)}×</td><td><a class="iconbtn sm" href="#mentor.${AREA_INFO[a.a].id}" title="Mentor de ${esc(ashort(a.a))}" aria-label="Mentor de ${esc(ashort(a.a))}">${ic("spark")}</a></td></tr>`).join("")}</tbody></table></div>`;
  const mAnd = R.metas.filter(m => m.ativa && m.rt !== "Concluída" && (!f.area || m.area === f.area)).sort((a, b) => (a.prazo || "9").localeCompare(b.prazo || "9")).slice(0, 8);
  const inf = influencers("bem", { days: PER * 30, min: 20 }).filter(i => !i.k.startsWith("t:") || i.n >= 20).slice(0, 8);
  const body = `${vis("ov-idx", "Índice de vida e áreas", lineChart(L, series, { w: vw(8), h: 270, min: 0, max: 100, proj: 2, projLabels: projLabels(2), keys: K, click: "ref", hi: K.indexOf(REF), fmt: v => num(v, 0) }), { cls: "s8", sub: f.area ? `destaque: ${ashort(f.area)} (placar × 10)` : `${PER} meses + tendência · toque num mês para analisá-lo`, info: "Índice = média ponderada dos placares de dados das áreas × 10. As linhas finas são as áreas; filtre uma área para destacá-la.", table: () => ({ cols: [{ l: "Mês" }, ...series.map(s => ({ l: s.name, num: true, f: v => v == null ? "" : num(v) }))], rows: K.map((k, i) => [mlabel(k), ...series.map(s => s.data[i])]) }) })}

    ${vis("ov-mat", "Matriz das áreas", heat(AREAS.map(a => ({ l: ashort(a), key: a, color: acol(a) })), L, (i, j) => H[j].areas[i].dados, { xf: "area", sel: f.area }), { cls: "s7", sub: "placar de dados por mês · toque numa área para filtrar o relatório", table: () => ({ cols: [{ l: "Área" }, ...L.map(l => ({ l, num: true, f: v => v == null ? "" : num(v) }))], rows: AREAS.map((a, i) => [a, ...H.map(h => h.areas[i].dados)]) }) })}
    ${vis("ov-radar", "Roda: sente × dados × alvo", radar(R.areas), { cls: "s5", sub: mlabel(R.mk) })}
    ${vis("ov-sc", "Placar por área", tbl, { cls: "s7", sub: "condicional por cor · toque numa linha para filtrar", table: () => ({ cols: [{ l: "Área" }, { l: "Dados", num: true }, { l: "Mês anterior", num: true }, { l: "Percepção", num: true }, { l: "Alvo", num: true }, { l: "Peso", num: true }], rows: rows.map(a => [a.a, a.dados, a.pv, a.perc, a.alvo, apeso(a.a)]) }) })}
    ${vis("ov-metas", "Metas · progresso × tempo", mAnd.length ? `<div class="bud">${mAnd.map(m => `<div class="br click" data-ent="meta|${m.id}" role="button" tabindex="0" ${tip(`${m.meta}\nProgresso ${pct(m.prog)} · esperado ${pct(m.esp)}\n${m.rt}`)}><span>${areaDot(m.area)}${esc(m.meta)}</span><div class="bt"><i class="${m.st}" style="width:${m.prog * 100}%"></i>${m.esp != null ? `<b style="left:${m.esp * 100}%"></b>` : ""}</div><em class="${m.st}">${esc(m.rt)}</em></div>`).join("")}</div>` : emptyChart("Sem metas em andamento."), { cls: "s5", sub: f.area ? ashort(f.area) : "a marca é onde deveria estar hoje" })}
    ${vis("ov-ag", "Próximos 14 dias", agenda(R, 14, 12), { cls: "s6", sub: "tarefas, aniversários, documentos, rotinas e passos dos mentores" })}
    ${vis("ov-inf", "O que acompanha o seu humor", diverge(inf.map(i => ({ l: i.l, v: i.r, sub: i.groups ? `${i.groups.bin ? "com" : "alto"} ${num(i.groups.a)} × ${i.groups.bin ? "sem" : "baixo"} ${num(i.groups.b)} · ${i.n} dias` : `${i.n} dias`, go: `data-cx="${i.k}|bem"` })), { fmt: v => "r " + num(v, 2), max: 1 }), { cls: "s6", sub: `correlação com o humor do dia · ${PER * 30} dias · toque para cruzar`, info: "r vai de −1 a 1. Valores perto de zero indicam pouca relação. Correlação não prova causa.", table: () => ({ cols: [{ l: "Métrica" }, { l: "r", num: true, f: v => num(v, 2) }, { l: "Dias", num: true }], rows: inf.map(i => [i.l, i.r, i.n]) }) })}
    ${vis("ov-28", "Últimos 28 dias", `<div class="mt">Humor</div>${strip(R.days28, "humor", "div")}<div class="mt" style="margin-top:12px">Hábitos cumpridos</div>${strip(R.days28, "hab", "seq")}<div class="minis">${kmini(acol("Saúde física"), "Sono", R.sono == null ? "–" : num(R.sono) + " h", delta(R.sono, cmpBase(h => h.sono), { unit: " h", txt: false }))}${kmini(acol("Saúde física"), "Treinos", R.treinos, delta(R.treinos, cmpBase(h => h.treinos), { fmt: v => num(v, 0), txt: false }))}${kmini(acol("Aprendizado"), "Estudo", num(R.horasEst) + " h", delta(R.horasEst, cmpBase(h => h.horasEst), { unit: " h", txt: false }))}${kmini("var(--accent)", "Diário", plural(R.diaN, "entrada", "entradas"), R.diaHumor ? `humor ${num(R.diaHumor)}` : "")}</div>`, { cls: "s12", sub: "faixas diárias · cada quadrado é um dia" })}`;
  return reportPage(R, H, kp, body, null);
}

/* ---------------------------------------------------------------- Finanças */
function rFin(R) {
  const H = history(PER), L = H.map(h => mabbr(h.mk)), K = H.map(h => h.mk), f = xf(), F = R.fin, C = S.cfg;
  const inF = l => (!f.cat || l.cat === f.cat) && (!f.grp || (CAT_DESP[l.cat] || "Estilo de vida") === f.grp);
  const kp = [
    kcard({ ico: "coins", color: acol("Finanças"), l: "Receitas", v: eurK(F.rec), dl: delta(F.rec, cmpBase(h => h.fin.rec), { fmt: eurK }), sp: spark(H.map(h => h.fin.rec), acol("Finanças")) }),
    kcard({ ico: "download", color: GCOL["Estilo de vida"], l: "Despesas", v: eurK(F.desp), tgt: R.orcTot ? `${pct(F.desp / R.orcTot)} do orçamento` : "", dl: delta(F.desp, cmpBase(h => h.fin.desp), { up: false, fmt: eurK }), sp: spark(H.map(h => h.fin.desp), GCOL["Estilo de vida"]) }),
    kcard({ ico: "scatter", color: "var(--accent)", l: "Resultado", v: eurK(F.res), sub: `aportes ${eurK(F.apo)}`, dl: delta(F.res, cmpBase(h => h.fin.res), { fmt: eurK }), sp: spark(H.map(h => h.fin.res), "var(--accent)") }),
    kcard({ ico: "target", color: GCOL["Poupança"], l: "Taxa de poupança", v: pct(F.taxa), tgt: `meta ${pct(C.metaPoup)}`, dl: pctDelta(F.taxa, cmpBase(h => h.fin.taxa)), sp: spark(H.map(h => h.fin.taxa), GCOL["Poupança"]) }),
    kcard({ ico: "box", color: acol("Casa & organização"), l: "Reserva", v: R.reserva == null ? "–" : `${num(R.reserva)}<small> meses</small>`, tgt: `meta ${C.metaReserva}`, sp: spark(H.map(h => h.reserva), acol("Casa & organização")) }),
    kcard({ ico: "compass", color: acol("Aprendizado"), l: "Patrimônio líquido", v: eurK(R.pl), dl: delta(R.pl, cmpBase(h => h.pl), { fmt: eurK }), sp: spark(H.map(h => h.pl), acol("Aprendizado")), sub: R.plMes ? `fechado em ${mabbr(R.plMes)}` : "preencha em Orçamento" }),
  ];
  const grpData = g => H.map(h => f.cat ? (CAT_DESP[f.cat] === g ? h.fin.cat[f.cat] || 0 : 0) : f.grp && f.grp !== g ? 0 : h.fin.grp[g] || 0);
  const cols = colChart(L, GRUPOS.map(g => ({ name: g, color: GCOL[g], data: grpData(g) })), { stacked: true, w: vw(8), h: 260, fmt: eurK, keys: K, click: "ref", sel: R.mk, line: f.cat || f.grp ? [] : [{ name: "Receita", color: GCOL["Poupança"], data: H.map(h => h.fin.rec), fmt: eurK }, { name: "Resultado", color: "var(--accent)", data: H.map(h => h.fin.res), dash: true, fmt: eurK }], target: f.cat && S.orc[f.cat] ? +S.orc[f.cat] : null, targetLabel: "orçamento" });
  const wf = F.rec || F.desp ? waterfallH([{ l: "Receita", v: F.rec, total: true, color: GCOL["Poupança"] }, ...GRUPOS.map(g => ({ l: g, v: -(F.grp[g] || 0), color: GCOL[g] })), { l: "Aportes", v: -F.apo, color: "var(--a-pro)" }, { l: "Sobra em caixa", v: F.rec - F.desp - F.apo, total: true }]) + `<p class="note">${ic("info")}Da receita de ${eur(F.rec)}, ${F.rec ? pct((F.grp["Essencial"] || 0) / F.rec) : "–"} foi para o essencial, ${F.rec ? pct((F.grp["Estilo de vida"] || 0) / F.rec) : "–"} para estilo de vida e ${F.rec ? pct(F.apo / F.rec) : "–"} para aportes.</p>` : emptyChart("Sem receitas ou despesas no mês.");
  const cats = Object.entries(F.cat).map(([c, v]) => ({ l: c, v, color: GCOL[CAT_DESP[c] || "Estilo de vida"], key: c, sub: CAT_DESP[c] }));
  const bul = R.orcCats.filter(c => c.plan || c.real).sort((a, b) => (b.p ?? 0) - (a.p ?? 0)).map(c => ({ l: c.cat, real: c.real, plan: c.plan, pace: R.ritmo, st: c.st, key: c.cat }));
  const mk = R.mk, n = dim(mk), days = Array.from({ length: n }, (_, i) => `${mk}-${pad(i + 1)}`), pm = addMonth(mk, -1);
  const dsp = d => sum(S.lanc.filter(l => l.data === d && l.tipo === "Despesa" && inF(l)).map(l => l.valor));
  let acc = 0; const cum = days.map(d => d > TODAY ? null : (acc += dsp(d))); acc = 0; const cumP = days.map((_, i) => i < dim(pm) ? (acc += dsp(`${pm}-${pad(i + 1)}`)) : null);
  const orc = f.cat ? +S.orc[f.cat] || 0 : f.grp ? sum(Object.entries(S.orc).filter(([c]) => CAT_DESP[c] === f.grp).map(([, v]) => +v)) : R.orcTot;
  const dmap = {}; days.forEach(d => { const v = dsp(d); if (v) dmap[d] = v; });
  const top = R.lm.filter(l => l.tipo === "Despesa" && inF(l)).sort((a, b) => b.valor - a.valor), mx = Math.max(1, ...top.map(l => +l.valor));
  const pk = Object.keys(S.patr).filter(k => k <= mk).sort().slice(-12), pv = k => S.patr[k] || {};
  const body = `${vis("fin-cols", "Despesas por grupo, receita e resultado", cols, { cls: "s8", sub: `${PER} meses · toque num mês para analisá-lo${f.cat ? ` · filtro: ${f.cat}` : ""}`, table: () => ({ cols: [{ l: "Mês" }, { l: "Receita", num: true, f: v => eur(v) }, ...GRUPOS.map(g => ({ l: g, num: true, f: v => eur(v) })), { l: "Aportes", num: true, f: v => eur(v) }, { l: "Resultado", num: true, f: v => eur(v) }], rows: H.map(h => [mlabel(h.mk), h.fin.rec, ...GRUPOS.map(g => h.fin.grp[g] || 0), h.fin.apo, h.fin.res]) }) })}
    ${vis("fin-wf", "Cascata do mês", wf, { cls: "s4", sub: `${mlabel(mk)} · da receita à sobra` })}
    ${vis("fin-sk", "Para onde foi o dinheiro", sankey(F), { cls: "s6", sub: "receita → grupos → categorias · toque numa categoria para filtrar" })}
    ${vis("fin-tm", "Mapa das categorias", treemap(cats, { w: vw(6), h: 300, xf: "cat", sel: f.cat }), { cls: "s6", sub: "área proporcional ao gasto · toque para filtrar", table: () => ({ cols: [{ l: "Categoria" }, { l: "Grupo" }, { l: "Valor", num: true, f: v => eur(v, 2) }, { l: "% das despesas", num: true, f: v => pct(v, 1) }], rows: cats.sort((a, b) => b.v - a.v).map(c => [c.l, c.sub, c.v, F.desp ? c.v / F.desp : null]) }) })}
    ${vis("fin-bul", "Orçamento × real", bullet(bul, { xf: "cat", sel: f.cat }), { cls: "s6", sub: `barra = real · traço = orçamento · pontilhado = ritmo (${pct(R.ritmo)} do mês)`, act: `<a class="lnk" href="#fin.orc">Editar orçamento</a>`, table: () => ({ cols: [{ l: "Categoria" }, { l: "Real", num: true, f: v => eur(v, 2) }, { l: "Orçamento", num: true, f: v => v ? eur(v, 2) : "" }, { l: "Uso", num: true, f: v => v == null ? "" : pct(v) }], rows: R.orcCats.map(c => [c.cat, c.real, c.plan, c.p]) }) })}
    ${vis("fin-cum", "Gasto acumulado no mês", lineChart(days.map((_, i) => String(i + 1)), [{ name: "Este mês", color: GCOL["Estilo de vida"], data: cum }, { name: "Mês anterior", color: "var(--muted)", data: cumP, fill: false, dash: true, dots: false }, ...(orc ? [{ name: "Ritmo do orçamento", color: "var(--warn)", data: days.map((_, i) => orc * (i + 1) / n), fill: false, dash: true, dots: false }] : [])], { w: vw(6), h: 250, fmt: eurK, maxLabels: 10 }), { cls: "s6", sub: `${mlabel(mk)}${f.cat ? " · " + f.cat : f.grp ? " · " + f.grp : ""}${R.proj != null && !f.cat && !f.grp ? ` · projeção ${eur(R.proj)}` : ""}` })}
    ${vis("fin-cal", "Calendário de gastos", calMonth(mk, dmap, { fmt: v => eur(v), zero: "sem gastos" }), { cls: "s6", sub: `cor mais forte = dia mais caro${f.cat ? " · " + f.cat : ""}` })}
    ${vis("fin-top", "Maiores despesas do mês", top.length ? `<div class="hscroll"><table class="dt"><thead><tr><th>Descrição</th><th>Categoria</th><th class="num opt">Dia</th><th class="num">Valor</th><th class="opt" style="min-width:110px">Peso</th></tr></thead><tbody>${top.slice(0, 12).map(d => `<tr class="click" data-edit="lanc" data-id="${d.id}" tabindex="0"><td>${esc(d.desc || "—")}${d.origem === "diário" ? ` <span class="chip xs">diário</span>` : ""}</td><td><button type="button" class="gtag" style="--c:${GCOL[CAT_DESP[d.cat] || "Estilo de vida"]}" data-xf="cat|${esc(d.cat)}">${esc(d.cat)}</button></td><td class="num opt">${fmtD(d.data)}</td><td class="num"><span class="vcell" style="--a:${Math.round(+d.valor / mx * 50)}%">${eur(+d.valor, 2)}</span></td><td class="opt"><div class="mbar"><i style="width:${+d.valor / mx * 100}%"></i></div></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="3">${plural(top.length, "despesa", "despesas")}</td><td class="num"><b>${eur(sum(top.map(l => +l.valor)), 2)}</b></td><td class="opt"></td></tr></tfoot></table></div>` : emptyChart("Sem despesas com esses filtros."), { cls: "s6", sub: "toque para editar · toque na categoria para filtrar", table: () => ({ cols: [{ l: "Data" }, { l: "Descrição" }, { l: "Categoria" }, { l: "Valor", num: true, f: v => eur(v, 2) }], rows: top.map(l => [l.data, l.desc, l.cat, +l.valor]) }) })}
    ${vis("fin-pl", "Patrimônio", pk.length >= 2 ? lineChart(pk.map(mabbr), [{ name: "Patrimônio líquido", color: "var(--accent)", data: pk.map(k => (+pv(k).contas || 0) + (+pv(k).reserva || 0) + (+pv(k).invest || 0) + (+pv(k).outros || 0) - (+pv(k).dividas || 0)), width: 3 }, { name: "Reserva", color: GCOL["Poupança"], data: pk.map(k => +pv(k).reserva || 0), fill: false }, { name: "Investimentos", color: acol("Aprendizado"), data: pk.map(k => +pv(k).invest || 0), fill: false }, { name: "Dívidas", color: "var(--crit)", data: pk.map(k => +pv(k).dividas || 0), fill: false, dash: true }], { w: vw(6), h: 250, fmt: eurK }) : emptyChart("Preencha o patrimônio de pelo menos dois meses em Finanças › Orçamento & patrimônio."), { cls: "s6", sub: "fim de cada mês" })}
    ${vis("fin-ass", "Assinaturas", hbars(R.ass.sort((a, b) => b.mensal - a.mensal).map(a => ({ l: a.servico, v: a.mensal, color: a.uso === "Baixo" ? "var(--crit)" : a.uso === "Médio" ? "var(--warn)" : GCOL["Poupança"], sub: `uso ${a.uso.toLowerCase()} · ${a.periodo.toLowerCase()}`, txt: eur(a.mensal, 2) })), { empty: "Sem assinaturas cadastradas." }) + (R.economia ? `<p class="note">${ic("bolt")}Cancelar as de uso baixo libera <b>${eur(R.economia, 2)}/mês</b> (${eur(R.economia * 12)} por ano).</p>` : ""), { cls: "s6", sub: `${eur(R.assMes, 2)} por mês` })}`;
  return reportPage(R, H, kp, body, ["Finanças"]);

/* ---------------------------------------------------------------- Crescimento */

  ];
  const hrs = {}; S.estudo.filter(e => mkey(e.data) >= K[0]).forEach(e => hrs[e.item] = (hrs[e.item] || 0) + (+e.horas || 0));
  const items = Object.entries(hrs).sort((a, b) => b[1] - a[1]).map(x => x[0]), top = items.slice(0, 5), pal = ["var(--a-apr)", "var(--a-car)", "var(--a-men)", "var(--a-laz)", "var(--a-fam)", "var(--muted)"];
  const ser = [...top.map((it, i) => ({ name: it, color: pal[i], data: K.map(k => sum(S.estudo.filter(e => e.item === it && mkey(e.data) === k).map(e => e.horas))) })), ...(items.length > 5 ? [{ name: "Outros", color: pal[5], data: K.map(k => sum(S.estudo.filter(e => !top.includes(e.item) && mkey(e.data) === k).map(e => e.horas))) }] : [])];

  const fun = funnel([{ l: "Candidaturas", v: S.cand.length, color: acol("Carreira") }, ...stages.map((s, i) => ({ l: s, v: reach(s), color: `color-mix(in srgb, ${acol("Carreira")} ${90 - i * 14}%, var(--surface))` }))]);
  const prog = S.aprend.filter(a => a.status === "Em andamento").map(a => ({ l: a.titulo, v: +a.total ? clamp(+a.atual / +a.total) : 0, sub: `${a.tipo} · ${num(sum(S.estudo.filter(e => e.item === a.titulo).map(e => e.horas)))} h`, color: acol(a.area || "Aprendizado"), txt: pct(+a.total ? clamp(+a.atual / +a.total) : 0) }));
  const lzc = {}; S.lazer.filter(l => l.data >= addDays(TODAY, -PER * 30)).forEach(l => { const o = lzc[l.cat] ||= { h: 0, s: [], c: 0, n: 0 }; o.h += +l.horas || 0; if (isNum(l.sat)) o.s.push(+l.sat); o.c += +l.custo || 0; o.n++; });
  const lpts = Object.entries(lzc).map(([c, o], i) => ({ x: o.h, y: avg(o.s) ?? 3, r: 5 + Math.sqrt(o.c) * .9, color: pal[i % 5], label: c, tip: `${c}\n${num(o.h)} h em ${o.n} atividades\nsatisfação ${num(avg(o.s))}\ncusto ${eur(o.c)}` }));
  const books = S.aprend.filter(a => a.tipo === "Livro" && a.status === "Concluído" && a.fim).sort((a, b) => b.fim.localeCompare(a.fim));
  const body = `${vis("cr-st", "Horas de estudo por assunto", colChart(L, ser, { stacked: true, w: vw(8), h: 260, keys: K, click: "ref", sel: R.mk, fmt: v => num(v, 0) + " h", target: C.metaEstudo, targetLabel: "meta mensal" }), { cls: "s8", sub: `${PER} meses`, table: () => ({ cols: [{ l: "Mês" }, ...ser.map(s => ({ l: s.name, num: true, f: v => num(v) }))], rows: K.map((k, i) => [mlabel(k), ...ser.map(s => s.data[i])]) }) })}

    ${vis("cr-cp", "Competências: atual → alvo", dumbbell(S.comp.map(c => ({ l: c.nome, a: +c.atual || 0, b: +c.alvo || 0, edit: ["comp", c.id] })), { max: 5 }), { cls: "s6", sub: "1 iniciante · 5 referência · toque para editar" })}
    ${vis("cr-pr", "O que estou aprendendo", hbars(prog, { max: 1, fmt: pct, empty: "Nada em andamento." }), { cls: "s6", sub: "progresso e horas acumuladas" })}
    ${vis("cr-lz", "Lazer: horas × satisfação", scatter(lpts, { w: vw(6), h: 270, xl: "Horas no período", yl: "Satisfação", yr: [1, 5], op: .8 }), { cls: "s6", sub: `por categoria · tamanho = custo · ${PER * 30} dias` })}
    ${vis("cr-bk", "Livros concluídos", books.length ? `<div class="list">${books.slice(0, 10).map(b => `<button type="button" class="li click" data-ent="apr|${b.id}"><div class="t">${esc(b.titulo)}<div class="m">${fmtDY(b.fim)}</div></div><span class="stars" aria-label="Nota ${b.nota || 0} de 5">${"★".repeat(+b.nota || 0)}<s>${"★".repeat(5 - (+b.nota || 0))}</s></span></button>`).join("")}</div>` : emptyChart("Nenhum livro concluído ainda."), { cls: "s6", sub: `${R.livros} no ano · meta ${C.metaLivros}` })}`;

  const qp = ms.filter(m => m.ativa && m.esp != null).map(m => ({ x: m.esp * 100, y: m.prog * 100, r: 7, color: acol(m.area), label: m.meta, edit: ["metas", m.id], tip: `${m.meta}\ntempo ${pct(m.esp)} · progresso ${pct(m.prog)}\n${m.rt}` }));

  const byA = AREAS.map(a => { const x = R.metas.filter(m => m.area === a && m.ativa); return { a, ok: x.filter(m => ["No ritmo", "Concluída", "Sem prazo"].includes(m.rt)).length, warn: x.filter(m => m.st === "warn").length, crit: x.filter(m => m.st === "crit").length }; }).filter(x => x.ok + x.warn + x.crit);
  const projs = [...new Set(S.tarefas.map(t => t.projeto).filter(Boolean))].map(p => { const ts = R.tar.filter(t => t.projeto === p && t.status !== "Cancelada"); return { p, n: ts.length, d: ts.filter(t => t.status === "Concluída").length, a: ts.filter(t => t.st === "crit").length }; });

/* ---------------------------------------------------------------- Cruzamentos (explorador) */
const CZ = { x: "sono", y: "bem", lag: 0, days: 180, gran: "d", target: "bem", rows: "m", cols: ["bem", "sono", "hab", "gasto", "estudo"] };
function metricSelect(id, val) { const ms = metricList(), gs = [...new Set(ms.map(m => m.grp))]; return `<select id="${id}" aria-label="Métrica">${gs.map(g => `<optgroup label="${esc(g)}">${ms.filter(m => m.grp === g).map(m => `<option value="${esc(m.k)}"${m.k === val ? " selected" : ""}>${esc(m.l)}</option>`).join("")}</optgroup>`).join("")}</select>`; }
function rCruz(R) {
  const H = history(PER), ms = metricList();
  if (!metric(CZ.x)) CZ.x = ms[0]?.k; if (!metric(CZ.y)) CZ.y = ms[1]?.k;
  const mx = metric(CZ.x), my = metric(CZ.y);
  if (!mx || !my) return `<div class="emptyb">${ic("scatter")}<b>Ainda não há dados para cruzar.</b><span>Faça check-ins, marque hábitos, registre gastos e escreva no diário por algumas semanas.</span></div>`;
  const c = crossData(CZ.x, CZ.y, { lag: CZ.lag, days: CZ.days, gran: CZ.gran }), jit = m => m.bin ? .15 : m.hi === 5 ? .35 : 0;
  const ctrl = `<div class="czc"><label>X ${metricSelect("czx", CZ.x)}</label><button type="button" class="iconbtn" data-act="czswap" title="Inverter X e Y" aria-label="Inverter X e Y">${ic("repeat")}</button><label>Y ${metricSelect("czy", CZ.y)}</label>
    <label>Defasagem <select id="czlag">${[[0, "mesmo período"], [1, "Y no período seguinte"], [2, "2 períodos depois"], [7, "7 períodos depois"]].map(([v, l]) => `<option value="${v}"${CZ.lag === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <label>Janela <select id="czdays">${[[90, "90 dias"], [180, "6 meses"], [365, "1 ano"], [730, "2 anos"]].map(([v, l]) => `<option value="${v}"${CZ.days === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <div class="segs">${[["d", "Dia"], ["w", "Semana"], ["m", "Mês"]].map(([k, l]) => `<button type="button" class="seg" data-czgran="${k}" aria-pressed="${CZ.gran === k}">${l}</button>`).join("")}</div></div>`;
  const read = !c || c.n < 5 ? `<div class="empty">Poucos pontos em comum (${c?.n || 0}). Aumente a janela ou escolha outras métricas.</div>` : `<div class="czr"><div class="czbig"><b>${c.r == null ? "–" : num(c.r, 2)}</b><span>correlação ${c.r == null ? "" : rWord(c.r)}${c.r != null && Math.abs(c.r) >= .15 ? (c.r > 0 ? " positiva" : " negativa") : ""}</span><small>${plural(c.n, CZ.gran === "d" ? "dia" : CZ.gran === "w" ? "semana" : "mês", CZ.gran === "d" ? "dias" : CZ.gran === "w" ? "semanas" : "meses")} com os dois registros</small></div>
    ${c.groups ? `<div class="czg"><div><span>${c.groups.bin ? "Com" : "X alto"}</span><b>${mfmt(CZ.y, c.groups.a)}</b><div class="mbar"><i style="width:${clamp(c.groups.a / Math.max(c.groups.a, c.groups.b, 1e-9)) * 100}%"></i></div></div><div><span>${c.groups.bin ? "Sem" : "X baixo"}</span><b>${mfmt(CZ.y, c.groups.b)}</b><div class="mbar"><i style="width:${clamp(c.groups.b / Math.max(c.groups.a, c.groups.b, 1e-9)) * 100}%"></i></div></div></div>` : ""}
    <p>${c.groups ? `${c.groups.bin ? `Nos ${CZ.gran === "d" ? "dias" : "períodos"} com <b>${esc(mx.l.toLowerCase())}</b>` : `No terço com <b>${esc(mx.l.toLowerCase())}</b> mais alto`}, <b>${esc(my.l.toLowerCase())}</b> fica em ${mfmt(CZ.y, c.groups.a)}, contra ${mfmt(CZ.y, c.groups.b)} ${c.groups.bin ? "sem" : "no terço mais baixo"}${CZ.lag ? ` (${CZ.lag} período(s) depois)` : ""}.` : ""}${c.fit && !mx.bin ? ` Cada unidade a mais em X acompanha ${sgn(c.fit.b, v => num(v, 3))} em Y.` : ""}</p>
    <p class="note">Correlação mostra que as coisas andam juntas, não que uma causa a outra. Use como hipótese para testar.</p>
    <div class="row wrap"><button type="button" class="btn sm" data-czask="1">${ic("spark")}Pedir leitura ao Conselho</button></div></div>`;
  const D = DAILY(), s0 = Math.max(0, D.N - CZ.days);

    const base = avg(D.C.bem);

      for (const a of p.areas) areas[a] = (areas[a] || 0) + 1; }

      for (const w of new Set((norm(e.texto.replace(/@\[[^\]]*\]|@\S+|#\S+|\[\[[^\]]*\]\]|^\s*\/.*$/gm, " ")).match(/[a-z]{4,}/g) || []).filter(w => !STOP.has(w)))) bag[w] = (bag[w] || 0) + 1; }

  });
}

    ${panel("Últimos registros", `<div class="hscroll"><table class="dt"><thead><tr><th>Dia</th><th class="num">Sono</th><th class="num">Humor</th><th class="num">Energia</th><th class="num">Estresse</th><th>Treino</th><th class="num opt">Passos</th><th class="num opt">Peso</th></tr></thead><tbody>${last.map(([d, x]) => `<tr class="click${d === day ? " sel" : ""}" data-ckday="${d}" tabindex="0"><td>${fmtD(d)} <span class="muted">${DOWS[parse(d).getDay()]}</span></td><td class="num">${x.sono ?? ""}</td><td class="num">${x.humor ?? ""}</td><td class="num">${x.energia ?? ""}</td><td class="num">${x.estresse ?? ""}</td><td>${esc(x.treino || "")}${x.min ? ` · ${x.min}′` : ""}</td><td class="num opt">${x.passos ? num(x.passos, 0) : ""}</td><td class="num opt">${x.peso ?? ""}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">Faça seu primeiro check-in ao lado.</td></tr>`}</tbody></table></div>`)}</div>`;

function metricArea(k) {

  if (["humor", "bem", "energia", "estresse", "dhumor"].includes(k)) return "Saúde mental";
  if (k === "gasto" || k === "receita" || k.startsWith("g:") || k.startsWith("c:")) return "Finanças";
  if (k === "estudo") return "Aprendizado";
  if (k === "lazer" || k === "lazsat") return "Lazer & criatividade";
  if (k.startsWith("h:")) return S.habitos.find(h => "h:" + h.id === k)?.area || null;
  if (k.startsWith("p:")) { const p = S.pessoas.find(x => "p:" + x.nome === k); return p ? relArea(p.relacao) : null; }

const aiMetricOk = k => aiAreaOk(metricArea(k)) && !privateTags().has(k.startsWith("t:") ? k.slice(2) : "");

}

  else if (t.dataset.orc) { if (v === "") delete S.orc[t.dataset.orc]; else S.orc[t.dataset.orc] = +v; touch("orc", { label: "Orçamento" }); }
  else if (t.dataset.patr) { S.patr[REF] = { ...(S.patr[REF] || {}), [t.dataset.patr]: v === "" ? "" : +v }; touch("patr", { label: "Patrimônio" }); }
  else if (t.dataset.cfg) { S.cfg[t.dataset.cfg] = t.type === "checkbox" ? t.checked : t.type === "number" ? (v === "" ? "" : +v) : v; touch("cfg", { label: "Ajuste" }); }
  else if (t.dataset.sdi) { const d = t.dataset.day || CHECKIN || TODAY, val = t.type === "number" ? (v === "" ? null : +v) : v; S.saude[d] = { ...(S.saude[d] || {}), [t.dataset.sdi]: val }; touch("saude", { label: "Check-in" }); }
  else if (t.id === "ck_day") { CHECKIN = v && v !== TODAY ? v : null; render(); }
  else if (t.id === "cmpSel") { CMP = v; render(); }
  else if (t.id === "areaSel") { xf().area = v || null; render(); }
  else if (t.id === "dz_modelo") { const tp = TEMPLATES[v]; if (tp && DIA.draft) { DIA.draft.texto = (DIA.draft.texto ? DIA.draft.texto.replace(/\s+$/, "") + "\n\n" : "") + tp[1]; if (!DIA.draft.titulo && v !== "livre") DIA.draft.titulo = tp[0]; storeDraft(); render(); setTimeout(() => { const ta = $("#dz_texto"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 30); } }
  else if (t.id === "tf_area") { TF.area = v; render(); } else if (t.id === "tf_proj") { TF.proj = v; render(); } else if (t.id === "lf_cat") { LF.cat = v; render(); }
});
document.addEventListener("focusout", e => { if (e.target.id === "dz_texto") setTimeout(() => { if (document.activeElement?.id !== "dz_texto" && !document.activeElement?.closest?.("#ac")) { AC.open = false; const b = $("#ac"); if (b) b.hidden = true; } }, 150); });
/* dicas: mouse, teclado e toque */
function showTip(el, x, y) { const tp = $("#tip"); tp.textContent = el.dataset.tip; tp.hidden = false; const w = tp.offsetWidth, h = tp.offsetHeight; tp.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + "px"; tp.style.top = (y + 18 + h > innerHeight ? y - h - 12 : y + 18) + "px"; }
document.addEventListener("mouseover", e => { const el = e.target.closest?.("[data-tip]"); if (!el) { $("#tip").hidden = true; return; } showTip(el, e.clientX, e.clientY); });
document.addEventListener("mousemove", e => { const tp = $("#tip"); if (tp.hidden) return; const el = e.target.closest?.("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); });
document.addEventListener("focusin", e => { const el = e.target.closest?.("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 10); } });
document.addEventListener("pointerdown", e => { if (e.pointerType !== "touch") return; const el = e.target.closest?.("[data-tip]"); if (!el) { $("#tip").hidden = true; return; } showTip(el, e.clientX, e.clientY); clearTimeout(showTip.t); showTip.t = setTimeout(() => { $("#tip").hidden = true; }, 2600); });
document.addEventListener("scroll", () => { $("#tip").hidden = true; }, { passive: true, capture: true });
window.addEventListener("hashchange", route);
window.addEventListener("resize", debounce(() => { const old = REPW; measureGrid(); if (Math.abs(old - REPW) > 8 && isReport()) render(); else pack(); }, 180));

/* ================================================================ inicialização */
(async function init() {
  try { const th = localStorage.getItem("atlas_theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
  S = exampleData(); IS_EXAMPLE = true; VER++; applyLists();
  REF = +TODAY.slice(8) <= 7 ? addMonth(mkey(TODAY), -1) : mkey(TODAY);
  DIA.draft = loadDraft(); snapAll(); route();
  const use = n => { try { return Promise.resolve(window.claude?.use?.(n)).catch(() => null); } catch { return Promise.resolve(null); } };
  use("sample").then(async s => { SAMPLE = s || null; if (s) { const lim = await s.limits().catch(() => null); TOOLS_MAX = lim?.tools ? (lim.tools.maxCount || 8) : 0; } if (["mentores", "mentor", "diario"].includes(PAGE)) render(); });
  use("downloads").then(d => { DL = d || null; });
  use("mcp").then(async m => { MCP = m || null; await notionStatus(); if (PAGE === "integ") render(); });
  const loaded = await loadStore();
  if (Object.keys(loaded).length) { const E = EMPTY(); S = { ...E, ...loaded, priv: { ...E.priv, ...(loaded.priv || {}) }, radar: { ...E.radar, ...(loaded.radar || {}) }, cfg: { ...E.cfg, ...(loaded.cfg || {}) }, integ: { ...E.integ, ...(loaded.integ || {}), notion: { ...E.integ.notion, ...(loaded.integ?.notion || {}) } }, listas: { ...E.listas, ...(loaded.listas || {}) } }; IS_EXAMPLE = false; }
  applyLists(); VER++; LOADED = true; snapAll(); UNDO.length = 0; REDO.length = 0;
  try { radarSync(); } catch (e) { console.warn("radar", e); }
  render();
})();
