<title>Atlas da Vida 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: barra lateral de atlas + tela de relatório em 12 colunas com trilho de contexto à direita; abas de páginas embaixo (estilo Power BI).
   Escuro por padrão (tinta azulada), claro espelhado. Serifa editorial nos títulos e no diário; Geist na interface; 11 cores de área. */
:root{
  --bg:#0c0e12; --bg-2:#08090c; --surface:#13161c; --surface-2:#191d25; --surface-3:#20252f; --line:#232832; --line-2:#2f3542;
  --ink:#e9ecf2; --ink-2:#b2b9c6; --muted:#7d8697; --accent:#8c9dff; --accent-ink:#0c0e12;
  --good:#3ccf91; --warn:#ffc145; --crit:#ff6b6b; --cell:#1b1f27; --cell-mid:#272c37;
  --a-fis:#ff7b6b; --a-men:#46d1c0; --a-fin:#5ad68f; --a-car:#4fb3ff; --a-apr:#b48cff; --a-fam:#ff9f4a; --a-amo:#ff6f9c; --a-ami:#f29be0; --a-laz:#c4e05a; --a-pro:#e8cd6a; --a-cas:#9fb0c8;
  --g-ess:#4fb3ff; --g-est:#ff6f9c; --g-cre:#b48cff; --g-pou:#5ad68f;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 30px -12px rgba(0,0,0,.55); --shadow-2:0 24px 60px -18px rgba(0,0,0,.75); --scrim:rgba(4,5,8,.62);
  --f-ui:"Geist","Segoe UI",system-ui,-apple-system,sans-serif; --f-display:"Newsreader","Iowan Old Style","Georgia",serif; --f-mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:14px; --r-sm:9px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5f8; --bg-2:#eceef3; --surface:#ffffff; --surface-2:#f3f5f8; --surface-3:#e9ecf2; --line:#e2e5eb; --line-2:#d2d7e0;
  --ink:#141820; --ink-2:#434b59; --muted:#717a8a; --accent:#4f63e0; --accent-ink:#ffffff;
  --good:#138a55; --warn:#ad7208; --crit:#d23b3b; --cell:#eef0f4; --cell-mid:#e3e6ed;
  --a-fis:#dd513b; --a-men:#0f9585; --a-fin:#1d9a59; --a-car:#1d79cf; --a-apr:#7650d6; --a-fam:#dc7410; --a-amo:#d6396a; --a-ami:#b04aaa; --a-laz:#6a9614; --a-pro:#a8840f; --a-cas:#5b6c88;
  --g-ess:#1d79cf; --g-est:#d6396a; --g-cre:#7650d6; --g-pou:#1d9a59;
  --shadow:0 1px 2px rgba(20,24,32,.05),0 8px 24px -14px rgba(20,24,32,.18); --shadow-2:0 24px 60px -20px rgba(20,24,32,.35); --scrim:rgba(20,24,32,.35); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f4f5f8; --bg-2:#eceef3; --surface:#ffffff; --surface-2:#f3f5f8; --surface-3:#e9ecf2; --line:#e2e5eb; --line-2:#d2d7e0;
  --ink:#141820; --ink-2:#434b59; --muted:#717a8a; --accent:#4f63e0; --accent-ink:#ffffff;
  --good:#138a55; --warn:#ad7208; --crit:#d23b3b; --cell:#eef0f4; --cell-mid:#e3e6ed;
  --a-fis:#dd513b; --a-men:#0f9585; --a-fin:#1d9a59; --a-car:#1d79cf; --a-apr:#7650d6; --a-fam:#dc7410; --a-amo:#d6396a; --a-ami:#b04aaa; --a-laz:#6a9614; --a-pro:#a8840f; --a-cas:#5b6c88;
  --g-ess:#1d79cf; --g-est:#d6396a; --g-cre:#7650d6; --g-pou:#1d9a59;
  --shadow:0 1px 2px rgba(20,24,32,.05),0 8px 24px -14px rgba(20,24,32,.18); --shadow-2:0 24px 60px -20px rgba(20,24,32,.35); --scrim:rgba(20,24,32,.35); color-scheme:light }
:root[data-theme="dark"]{
  --bg:#0c0e12; --bg-2:#08090c; --surface:#13161c; --surface-2:#191d25; --surface-3:#20252f; --line:#232832; --line-2:#2f3542;
  --ink:#e9ecf2; --ink-2:#b2b9c6; --muted:#7d8697; --accent:#8c9dff; --accent-ink:#0c0e12;
  --good:#3ccf91; --warn:#ffc145; --crit:#ff6b6b; --cell:#1b1f27; --cell-mid:#272c37;
  --a-fis:#ff7b6b; --a-men:#46d1c0; --a-fin:#5ad68f; --a-car:#4fb3ff; --a-apr:#b48cff; --a-fam:#ff9f4a; --a-amo:#ff6f9c; --a-ami:#f29be0; --a-laz:#c4e05a; --a-pro:#e8cd6a; --a-cas:#9fb0c8;
  --g-ess:#4fb3ff; --g-est:#ff6f9c; --g-cre:#b48cff; --g-pou:#5ad68f;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 30px -12px rgba(0,0,0,.55); --shadow-2:0 24px 60px -18px rgba(0,0,0,.75); --scrim:rgba(4,5,8,.62); color-scheme:dark }

/* ---------------------------------------------------------------- base */
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:var(--f-mono)}
.st-good{color:var(--good)!important} .st-warn{color:var(--warn)!important} .st-crit{color:var(--crit)!important} .st-none{color:var(--muted)}
.ico{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;color:var(--c,currentColor)}
.ico svg{width:100%;height:100%}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}
.lead{color:var(--ink-2);max-width:78ch;margin:0 0 18px;font-size:14.5px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;margin:10px 0 0;display:flex;gap:6px;align-items:flex-start}
.note .ico{width:15px;height:15px;margin-top:2px;color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
.emptyb{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:42px 16px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--r)}
.emptyb .ico{width:30px;height:30px;color:var(--accent)} .emptyb b{font-size:15px;color:var(--ink)} .emptyb span{max-width:52ch}

/* ---------------------------------------------------------------- moldura */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg-2);border-right:1px solid var(--line);padding:16px 12px 14px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
.brand .mark{width:34px;height:34px;flex:none}.brand .mark svg{width:100%;height:100%}
.brand b{display:block;font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn.navx{display:none;margin-left:auto}
.navsearch{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 10px;margin:0 0 10px;cursor:pointer;font-size:13px;text-align:left}
.navsearch>span:not(.ico){flex:1}.navsearch:hover{border-color:var(--line-2);color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2)}
.navg{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 10px 5px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;position:relative;transition:background .15s,color .15s}
.nv .ico{color:var(--muted);transition:color .15s}
.nv:hover{background:var(--surface);color:var(--ink)}.nv:hover .ico{color:var(--ink-2)}
.nv.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nv.on .ico{color:var(--accent)}
.nv.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nv>span:not(.ico){flex:1}
.nb{font-style:normal;font-size:11px;font-weight:600;font-family:var(--f-mono);min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.nb.acc{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.navfoot{margin-top:auto;padding:14px 8px 0;display:flex;flex-direction:column;gap:6px}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.savest::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.savest.ok::before{background:var(--good)}.savest.local::before{background:var(--a-car)}.savest.saving::before{background:var(--warn);animation:pulse 1s infinite}.savest.err::before{background:var(--crit)}.savest.ex::before{background:var(--a-pro)}
@keyframes pulse{50%{opacity:.3}}
.kbdh{font-size:11px;color:var(--muted);opacity:.8}
main{min-width:0;padding-block:18px 96px;padding-inline:32px;outline:none}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin-bottom:16px}
.ttl{min-width:0;flex:1 1 360px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.02em}.crumb a{color:var(--ink-2);text-decoration:none}.crumb a:hover{color:var(--ink)}
.top h1{font-family:var(--f-display);font-weight:500;font-size:36px;line-height:1.08;letter-spacing:-.02em;margin:2px 0 2px;text-wrap:balance}
.top .sub{color:var(--ink-2);font-size:13.5px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover:not(:disabled){color:var(--ink);border-color:var(--line-2)}.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.sm{width:28px;height:28px;border-radius:7px}.iconbtn.sm .ico{width:15px;height:15px}
.iconbtn.menu{display:none}
.srch{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.srch:hover{color:var(--ink-2);border-color:var(--line-2)}
.monthpick{display:flex;align-items:center;gap:2px;height:34px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.monthpick button{border:0;background:none;min-width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:17px;line-height:1}
.monthpick button:hover{background:var(--surface-2);color:var(--ink)}
.monthpick span{min-width:122px;text-align:center;font-weight:600;font-size:13px}
.monthpick .mnow{font-size:12px;font-weight:600;padding:0 9px;color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:color-mix(in srgb,var(--a-pro) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--a-pro) 32%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner .ico{color:var(--a-pro)}.banner>span:not(.ico){flex:1;min-width:220px}.banner b{color:var(--ink)}
.banner.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-color:color-mix(in srgb,var(--warn) 32%,var(--line))}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.subtabs .st{padding:9px 12px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs .st:hover{color:var(--ink)}.subtabs .st.on{color:var(--ink);border-bottom-color:var(--accent)}
.page{animation:fade .22s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.rtabs{position:sticky;bottom:0;z-index:6;display:flex;gap:2px;margin:22px -32px -96px;padding:8px 32px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rt{padding:7px 14px;border-radius:8px 8px 3px 3px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;border-bottom:2px solid transparent}
.rt:hover{color:var(--ink);background:var(--surface)}
.rt.on{color:var(--ink);background:var(--surface);border-color:var(--line);border-bottom-color:var(--accent)}

/* ---------------------------------------------------------------- controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn .ico{width:16px;height:16px}
.btn:hover:not(:disabled){border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn{max-width:100%}@media (max-width:480px){.btn{white-space:normal;text-align:center}}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;font-size:inherit;text-decoration:none}
.lnk:hover{text-decoration:underline}
.lnkb{background:none;border:0;padding:0;text-align:left;cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:0;color:var(--ink);transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.flbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin:14px 0 7px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.form.f2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.form.f3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.form.f4{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.form .full{grid-column:1/-1}
.form label,label.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:500}
label.lbl{margin-top:10px}
.segs{display:flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%}
.seg{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:500;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg .ico{width:14px;height:14px}
.seg:hover{color:var(--ink);background:var(--surface-3)}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 0 0 1px var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip .ico{width:13px;height:13px}.chip.xs{font-size:10.5px;padding:1px 6px}
.chipx{border:0;background:none;padding:0;margin-left:2px;cursor:pointer;color:var(--muted);display:inline-grid}.chipx .ico{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.adot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none;vertical-align:1px}
.atag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--ink));white-space:nowrap;border:0}
.atag.click{cursor:pointer}.atag.on{box-shadow:inset 0 0 0 1.5px var(--c)}
.atag small{opacity:.7;margin-left:4px;font-family:var(--f-mono)}
.gtag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));border:0;cursor:pointer;white-space:nowrap}

/* ---------------------------------------------------------------- relatórios */
.slicers{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.seg-g{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 10px}
.seg-g .flbl{margin:0}.seg-g select{border:0;background:transparent;width:auto;padding:4px 6px;font-weight:600;font-size:12.5px}
.seg-g select:focus{box-shadow:none}
.xfbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 12px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line))}
.xfl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-right:4px}
.xfc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.xfc b{color:var(--ink);font-weight:600}.xfc .ico{width:13px;height:13px;color:var(--muted)}
span.xfc{padding-right:10px;cursor:default}
.rep{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.repmain{min-width:0;display:flex;flex-direction:column;gap:16px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px}
.kc{position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 12%,var(--surface)) 0%,var(--surface) 58%);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 8px;min-width:0;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s,border-color .18s}
.kc.click{cursor:pointer}.kc.click:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.kc.hero{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 26%,var(--surface)) 0%,var(--surface) 70%);border-color:color-mix(in srgb,var(--c) 32%,var(--line))}
.kh{display:flex;align-items:center;gap:8px}

.eq.q1{background:color-mix(in srgb,var(--crit) 8%,var(--surface-2))}.eq.q2{background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}.eq.q3{background:color-mix(in srgb,var(--warn) 7%,var(--surface-2))}

.eqi{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:4px 0;text-align:left;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-top:1px solid var(--line)}
.eqi:hover{color:var(--ink)}.eqi small{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.stars{color:var(--a-pro);letter-spacing:1px;font-size:12px}.stars s{color:var(--line-2);text-decoration:none}
.czc{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.czc label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;min-width:170px;flex:1}
.czc select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-size:13px}
.czc .segs{align-self:flex-end}
.czr{display:flex;flex-direction:column;gap:10px}
.czbig{display:flex;flex-direction:column}.czbig b{font-size:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.czbig span{font-weight:600;color:var(--ink-2)}.czbig small{color:var(--muted);font-size:12px}
.czg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.czg div{background:var(--surface-2);border-radius:9px;padding:9px 11px}.czg span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}.czg b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.czr p{margin:0;font-size:13px;color:var(--ink-2)}
.inl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;flex:1}
.pvc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:10px}.pvc .flbl{margin:0 4px 0 6px}
.pvc select{width:auto}
.dt.pv td{white-space:nowrap}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{font-size:calc(11px + 7px * var(--w));padding:2px 9px;border-radius:999px;font-weight:500;opacity:calc(.55 + .45 * var(--w))}
.term.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}.term.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}

/* ---------------------------------------------------------------- painéis e páginas de registro */
.pn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.pn>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pn h2{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.pn h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.pn h2 .ico{width:17px;height:17px;color:var(--accent)}
.pn .pill{font-size:11px}
.g2c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g3c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.span2{grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.krow+.pn,.krow+.g2c,.krow+.g3c,.pn+.pn,.pn+.g2c{margin-top:16px}
.km{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;border-top:3px solid var(--c);min-width:0;box-shadow:var(--shadow)}
.minis .km{box-shadow:none;background:var(--surface-2);border-color:transparent;border-top-color:var(--c)}
.kml{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kmv{font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kms{font-size:12px;color:var(--ink-2)}
.kms .dl em{display:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover .t{color:var(--accent)}
.li .t{font-weight:500;min-width:0;flex:1}.li .m{font-size:12px;color:var(--muted);font-weight:400}
.more{font-size:12px;color:var(--muted);margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select{width:auto;max-width:200px}
.dsearch{position:relative;flex:1 1 200px;min-width:160px;max-width:320px}
.dsearch .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:15px;height:15px}
.dsearch input{padding-left:31px}
.quick{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:5px 5px 5px 10px}
.quick .qi{color:var(--accent)}.quick input{border:0;background:transparent;padding:6px 2px}.quick input:focus{box-shadow:none}
.qhint{font-size:12px;color:var(--muted);margin-top:6px}
.qhint.ok{color:var(--good)}.qhint.bad{color:var(--warn)}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:24px minmax(0,1fr) auto 54px 50px auto 28px;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.done .tmain b{color:var(--muted);text-decoration:line-through}
.tmain{border:0;background:none;text-align:left;cursor:pointer;min-width:0;padding:0;display:flex;flex-direction:column}
.tmain b{font-weight:500;overflow:hidden;text-overflow:ellipsis}.tmain small{font-size:11.5px;color:var(--muted)}
.tmain:hover b{color:var(--accent)}
.tprio{font-size:11px;font-weight:600;color:var(--muted)}.tprio.p-alta{color:var(--crit)}.tprio.p-media{color:var(--warn)}
.tdue{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right}
.tipo{font-size:12px;font-weight:600}.tipo.t-receita{color:var(--good)}.tipo.t-aporte{color:var(--a-apr)}.tipo.t-despesa{color:var(--ink-2)}
.ckl{display:flex;align-items:flex-start;gap:9px;cursor:pointer;min-width:0}
.ckl input{margin-top:2px;flex:none}
.ckl span{display:flex;flex-direction:column;min-width:0}.ckl span small{font-size:11.5px}
.ckl .done{color:var(--muted);text-decoration:line-through}
.orcl{display:flex;flex-direction:column;gap:7px}
.orcr{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(60px,1fr) 74px 86px;gap:10px;align-items:center;font-size:13px}
.orcr span{display:flex;flex-direction:column;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orcr span small{font-size:11px;color:var(--muted)}
.orcr em{font-style:normal;font-family:var(--f-mono);font-size:12px;text-align:right}
.orcr input{padding:4px 7px;font-size:12.5px}
.orct{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.orct b{font-family:var(--f-mono);text-align:right}
.range{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px 66px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.range label{font-weight:500;display:flex;align-items:center}
.range output{font-family:var(--f-mono);font-weight:600;text-align:right}
.hgrid{display:grid;gap:4px;align-items:center;font-size:12px;min-width:640px}
.hd{font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--f-mono);line-height:1.3}
.hd.today{color:var(--accent);font-weight:600}
.hname{border:0;background:none;text-align:left;cursor:pointer;padding:2px 4px;border-radius:6px;min-width:0}
.hname b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hname small{display:block;font-size:11px;color:var(--muted)}
.hname:hover{background:var(--surface-2)}
.tick{aspect-ratio:1;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;padding:0;width:100%;max-width:100%;transition:background .12s,transform .12s}
.tick.on{background:var(--c);border-color:var(--c)}
.tick:hover{transform:scale(1.06);border-color:var(--c)}
.cal{display:grid;gap:2px;align-items:center;min-width:480px}
.cn{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;color:var(--ink-2)}
.cd{aspect-ratio:1;border-radius:3px;background:var(--cell)}.cd.on{background:var(--c)}.cd.fut{opacity:.4}
.cp{font-family:var(--f-mono);font-size:11.5px;font-weight:600;text-align:right}
.lvl{color:var(--a-car);letter-spacing:2px}.lvl s{color:var(--line-2);text-decoration:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--c)}
.pc-h{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;cursor:pointer;padding:0;min-width:0}
.pc-h span:last-child{display:flex;flex-direction:column;min-width:0}.pc-h b{font-weight:600}.pc-h small{font-size:12px;color:var(--muted)}
.pc-h:hover b{color:var(--c)}
.pav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);flex:none}
.pc-b{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pc-a{display:flex;justify-content:space-between;align-items:center}
.prio{display:flex;flex-direction:column;gap:7px}
.prio label{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:6px}
.prio span{font-family:var(--f-mono);color:var(--accent);font-weight:600;text-align:center}
.hoje{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.tcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.ck3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.sc1 .flbl{margin-top:0}
.mchips{display:flex;gap:5px;flex-wrap:wrap}
.mchip{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);transition:all .12s}
.mchip:hover{border-color:var(--muted);color:var(--ink)}
.mchip.m1{--m:var(--crit)}.mchip.m2{--m:color-mix(in srgb,var(--crit) 55%,var(--warn))}.mchip.m3{--m:var(--warn)}.mchip.m4{--m:color-mix(in srgb,var(--good) 65%,var(--warn))}.mchip.m5{--m:var(--good)}.mchip.m6{--m:var(--good)}
.mchip[aria-pressed="true"]{background:color-mix(in srgb,var(--m) 22%,var(--surface));border-color:var(--m);color:var(--ink)}
.hgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.hbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;cursor:pointer;text-align:left;transition:all .15s}
.hbtn:hover{border-color:var(--c)}
.hck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;transition:all .15s}
.hck .ico{width:15px;height:15px;color:inherit}
.hbtn.on{background:color-mix(in srgb,var(--c) 13%,var(--surface-2));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.hbtn.on .hck{background:var(--c);border-color:var(--c);color:var(--bg)}
.hn{display:flex;flex-direction:column;min-width:0;font-weight:500;font-size:13px}.hn small{font-size:11.5px;color:var(--muted);font-weight:400}

/* ---------------------------------------------------------------- diário */
.diary{display:grid;grid-template-columns:286px minmax(0,1fr);gap:20px;align-items:start}
.dside{position:sticky;top:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin}
.dside .segs{margin-top:10px}
.tagcloud{display:flex;flex-wrap:wrap;gap:5px}
.tagcloud small{font-family:var(--f-mono);opacity:.7;font-size:10.5px}
.dstats{display:flex;flex-direction:column;gap:8px}.dstats .km{box-shadow:none;background:var(--surface-2);border-color:transparent;border-top-color:var(--c)}
.dmain{min-width:0;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;flex-direction:column;gap:12px}
.czopen{display:flex;align-items:center;gap:12px;width:100%;border:1px dashed var(--line-2);background:var(--surface);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;color:var(--ink-2);flex-wrap:wrap;transition:border-color .15s}
.czopen .ico{color:var(--accent);width:20px;height:20px}
.czopen>span:not(.ico){font-family:var(--f-display);font-size:19px;font-style:italic;color:var(--ink-2);flex:1}
.czopen small{font-size:12px;color:var(--muted)}
.czopen:hover{border-color:var(--accent)}
.composer{background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:14px 16px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent),var(--shadow);display:flex;flex-direction:column;gap:10px}
.cz-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cz-title{flex:1 1 240px;font-family:var(--f-display);font-size:21px!important;font-weight:500;border:0!important;background:transparent!important;padding:2px 0!important}
.cz-title:focus{box-shadow:none!important}
.cz-top .row input{width:auto}
.cz-moods{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.cz-moods .flbl{margin:0}.cz-moods .mchip{width:30px;height:30px}
.cz-moods select{width:auto;margin-left:auto}
.cz-tools{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.tb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12.5px;font-weight:500}
.tb .ico{width:15px;height:15px;color:var(--accent)}.tb:hover{background:var(--surface-2);color:var(--ink)}
.dz{font-family:var(--f-display);font-size:17px;line-height:1.65;min-height:210px;border:0!important;background:transparent!important;padding:4px 0!important}
.dz:focus{box-shadow:none!important}
.cz-live{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;min-height:26px}
.cz-live .flbl{margin:0 4px 0 0}
.lv{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.lv .ico{width:13px;height:13px}
.lv[style*="--c"]{background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--ink));border-color:transparent}
.lv.ok .ico{color:var(--good)}.lv.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);cursor:pointer}.lv.cmd{border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}.lv.cmd .ico{color:var(--accent)}.lv.bad{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.cz-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mgroup{display:flex;flex-direction:column;gap:12px}
.mhead{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-size:22px;font-weight:500;padding:8px 0 6px;background:linear-gradient(var(--bg) 70%,transparent)}
.mhead small{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.ent{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 13px 12px;box-shadow:var(--shadow);transition:border-color .2s}
.ent.pinned{border-color:color-mix(in srgb,var(--a-pro) 40%,var(--line))}
.ent.focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.ent-date{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px;text-align:center}
.ent-date b{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.ent-date span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ent-date small{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.md{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:11.5px;font-weight:700;font-family:var(--f-mono);margin-top:6px;color:var(--bg);flex:none}
.md.m1{background:var(--crit)}.md.m2{background:color-mix(in srgb,var(--crit) 55%,var(--warn))}.md.m3{background:var(--warn)}.md.m4{background:color-mix(in srgb,var(--good) 65%,var(--warn))}.md.m5{background:var(--good)}
.ent-main{min-width:0}
.ent-main>header{display:flex;align-items:flex-start;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.ent-nt{font-size:12px;color:var(--muted);letter-spacing:.04em;padding-top:4px}
.ent h3{font-family:var(--f-display);font-size:21px;font-weight:500;margin:0;line-height:1.25;letter-spacing:-.01em}
.ent-act{display:flex;align-items:center;gap:1px;flex:none;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;max-width:100%}
.pinb{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--a-pro);font-weight:600;margin-right:4px}.pinb .ico{width:13px;height:13px}
.ent-body{font-family:var(--f-display);font-size:16.5px;line-height:1.7;color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.ent-body p{margin:0 0 8px;max-width:72ch}
.ent-body h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px;font-weight:600}
.ent-body ul,.ent-body ol{margin:4px 0 10px;padding-left:22px}
.ent-body ul.ck{list-style:none;padding-left:0}
.ent-body li{margin:2px 0}
.ent-body blockquote{margin:6px 0;padding:2px 0 2px 14px;border-left:3px solid var(--line-2);color:var(--ink-2);font-style:italic}
.ent-body .ckl{font-family:var(--f-display)}
.ent-body .ckl input{margin-top:6px}
.ent-body .ckl input:checked+span{color:var(--muted);text-decoration:line-through}
.mn,.tg,.lk{display:inline-flex;align-items:center;gap:4px;border:0;font:inherit;cursor:pointer;padding:0 5px;border-radius:6px;line-height:1.4;vertical-align:baseline}
.mn{font-family:var(--f-ui);font-size:.86em;font-weight:600;background:color-mix(in srgb,var(--accent) 15%,transparent);color:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.mn.unk{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent)}
.mn.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tg{font-family:var(--f-ui);font-size:.84em;font-weight:500;--c:var(--muted);background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.tg.on{box-shadow:inset 0 0 0 1.5px var(--c)}
.tagcloud .mn,.tagcloud .tg{font-size:12px;padding:3px 8px}
.lk{font-family:var(--f-ui);font-size:.84em;font-weight:500;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.lk .ico{width:13px;height:13px;color:var(--accent)}
.lk:hover,.mn:hover,.tg:hover{filter:brightness(1.15)}
.lk.unk{color:var(--muted);cursor:default;box-shadow:inset 0 0 0 1px dashed var(--line-2)}
.cmdl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-ui);font-size:13px;padding:6px 10px;border-radius:9px;margin:6px 0;background:var(--surface-2);border:1px solid var(--line)}
.cmdl .ico{width:15px;height:15px;color:var(--accent)}
.cmdl>span:not(.ico){flex:1;min-width:160px}
.cmdl em{font-style:normal;font-size:11.5px;font-weight:600}
.cmdl.ok em{color:var(--good)}.cmdl.pend{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}.cmdl.bad{border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}.cmdl .err{color:var(--crit)}
.ent footer{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ent-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctx{border-top:1px solid var(--line);padding-top:8px}
.ctx summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;list-style:none}
.ctx summary::-webkit-details-marker{display:none}
.ctx summary .ico{width:14px;height:14px;color:var(--accent)}
.ctx summary .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cx{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--ink-2)}
.cx .ico{width:13px;height:13px;color:var(--muted)}
.cx.good{color:var(--good)}.cx.good .ico{color:var(--good)}.cx.warn{color:var(--warn)}.cx.crit{color:var(--crit)}
.bls{display:flex;flex-direction:column;gap:6px}
.bl{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink)}
.bl:hover{border-color:var(--line-2)}
.bld{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.blt{display:flex;flex-direction:column;min-width:0}.blt b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.blt small{font-size:12px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bl .md{margin:0}
.aiblk{display:flex;flex-direction:column;gap:10px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.thinking .ico{color:var(--accent);animation:pulse 1.2s infinite}
.mdx{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.mdx p{margin:0 0 8px}.mdx p:last-child{margin-bottom:0}
.mdx h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px;font-weight:600}
.mdx ul,.mdx ol{margin:4px 0 8px;padding-left:20px}.mdx li{margin:3px 0}
.mdx li.ckli{list-style:"☐  "}.mdx li.ckli.done{list-style:"☑  ";color:var(--muted)}
.mdx code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.mdx blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.mdx a{color:var(--accent)}
.dayp .ent{box-shadow:none;background:var(--surface-2);margin-top:10px}

/* autocompletar e paleta */
.ac{position:fixed;z-index:80;width:300px;max-height:240px;overflow:auto;background:var(--surface-3);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-2);padding:5px}
.ach{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:5px 8px}
.aci{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--ink)}
.aci b{font-weight:500;font-size:13px}.aci small{font-size:11.5px;color:var(--muted)}
.aci.on,.aci:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
dialog{border:1px solid var(--line-2);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-2)}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
dialog form{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
dialog form.wide{width:100%}
dialog h3{font-family:var(--f-display);margin:0;font-size:22px;font-weight:500}
#dlg:has(form.wide){width:min(900px,calc(100vw - 32px))}
.dlgfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
#pal{width:min(660px,calc(100vw - 24px));margin-top:9vh;padding:0;overflow:hidden}
.palbox{display:flex;flex-direction:column;max-height:72vh}
.palin{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.palin .ico{color:var(--accent);width:20px;height:20px}
.palin input{border:0!important;background:transparent!important;font-size:17px;padding:6px 0!important;box-shadow:none!important}
.palres{overflow:auto;padding:6px 8px 10px}
.palg{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.pali{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 9px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink)}
.pali .ico{color:var(--muted)}.pali>span:not(.ico){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pali small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pali.on,.pali:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 14%,transparent)}.pali.on .ico{color:var(--accent)}
.pali:disabled{opacity:.7;cursor:default}
.palfoot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
#focusdlg{width:min(1240px,calc(100vw - 32px))}
.fdh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.fdh h3{font-family:var(--f-ui);font-size:16px;font-weight:600;margin:0}
.fdb{padding:16px 18px 20px;overflow:auto;max-height:calc(100vh - 140px)}
.fdt{margin-top:16px}.fdt summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.fdh .vb{opacity:1}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:11px;font-weight:500;font-size:13px;box-shadow:var(--shadow-2);max-width:calc(100vw - 32px)}
.tbtn{border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2);font-size:12px;padding:7px 10px;border-radius:9px;box-shadow:var(--shadow-2);max-width:300px;white-space:pre-line;line-height:1.45;font-variant-numeric:tabular-nums}

/* ficha lateral */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow-2);display:flex;flex-direction:column;animation:slide .24s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line)}
.drawer h2{font-family:var(--f-display);font-size:26px;font-weight:500;margin:2px 0 0;line-height:1.15}
.dwb{padding:14px 20px 30px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dwb .flbl{margin:8px 0 0}
.dwrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dwrow .kv{font-size:30px}
.kms3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kms3 .km{box-shadow:none;background:var(--surface-2);border-color:transparent;border-top-color:var(--c);padding:9px 10px}
.kms3 .kmv{font-size:18px}

/* ---------------------------------------------------------------- mentores */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{background:linear-gradient(170deg,color-mix(in srgb,var(--c) 9%,var(--surface)),var(--surface) 55%);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0;position:relative;transition:border-color .2s,transform .2s}
.mcard:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));transform:translateY(-2px)}
.mcard.wide{grid-column:1/-1;background:radial-gradient(90% 140% at 0% 0%,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 65%)}
.mcard header{display:flex;align-items:center;gap:11px}
.mcard h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:500;line-height:1.15}
.mcard header>div:nth-child(2){flex:1;min-width:0}
.mcard header .muted{font-size:12px}
.msc{text-align:right}.msc b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.msc small{font-family:var(--f-mono);font-size:11px;font-weight:600}
.mspark .spark{height:30px}
.mfoc{display:flex;flex-direction:column;gap:2px;font-size:13px}.mfoc .flbl{margin:0 0 2px}.mfoc small{color:var(--ink-2);font-size:12px}
.mnud{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:9px;padding:8px 10px;border-left:3px solid var(--muted)}
.mnud .ico{width:14px;height:14px;margin-top:3px;color:var(--accent)}
.mnud.good{border-left-color:var(--good)}.mnud.warn{border-left-color:var(--warn)}.mnud.crit{border-left-color:var(--crit)}
.mnud b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.mcard footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.mcard footer .muted{font-size:11.5px;line-height:1.35}
.mcard .nb{position:absolute;top:10px;right:10px}
.mav{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent)}
.mav .ico{width:22px;height:22px}
.mav.sm{width:30px;height:30px;border-radius:10px}.mav.sm .ico{width:16px;height:16px}
.mav.lg{width:64px;height:64px;border-radius:19px}.mav.lg .ico{width:32px;height:32px}
.mroom{display:grid;grid-template-columns:272px minmax(0,1fr) 340px;gap:16px;align-items:start}
.mprof{position:sticky;top:14px;display:flex;flex-direction:column;border-top:3px solid var(--c)}
.mprof h2{font-family:var(--f-display);font-size:24px;font-weight:500;margin:10px 0 0}
.mprof>p{margin:0 0 6px;font-size:12.5px}
.mscore{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.mscore b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em}.mscore small{display:block;font-size:11.5px;color:var(--muted)}
.since{background:color-mix(in srgb,var(--c) 9%,var(--surface-2));border-radius:10px;padding:9px 11px;margin-top:8px}
.since .flbl{margin:0 0 4px}.since ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:5px 0;font-size:12.5px;color:var(--ink-2);text-align:left;border-bottom:1px solid var(--line);cursor:default}
button.mrow{cursor:pointer}button.mrow:hover span{color:var(--ink)}
.mrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mprof .insight{margin-bottom:8px}.mprof .insight p{font-size:12.5px}
.mchatw{display:flex;flex-direction:column;padding:0;overflow:hidden;min-height:560px;position:sticky;top:14px}
.mchat{height:calc(100vh - 330px);min-height:380px;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.mintro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 10px;color:var(--ink-2)}
.mintro h3{font-family:var(--f-display);font-size:24px;font-weight:500;margin:6px 0 0;color:var(--ink)}
.mintro p{margin:0;max-width:52ch;font-size:13.5px}
.daysep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg.me{justify-content:flex-end}
.bub{border-radius:14px;padding:10px 13px;min-width:0;max-width:min(680px,88%)}
.msg.me .bub{background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-bottom-right-radius:4px;font-size:14px}
.msg.ai .bub{background:var(--surface-2);border:1px solid var(--line);border-top-left-radius:4px}
.usos{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.usos:empty{display:none}
.uso{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.uso b{font-weight:600;color:var(--ink)}.uso .ico{width:13px;height:13px;color:var(--c,var(--accent))}
.prop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;border:1px dashed color-mix(in srgb,var(--c,var(--accent)) 55%,var(--line));border-radius:11px;padding:10px 11px;background:var(--surface)}
.prop.aceita{border-style:solid;border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.prop.descartada{opacity:.55}
.prop-t{display:flex;gap:9px;align-items:flex-start;min-width:0;flex:1 1 260px}
.prop-t .ico{color:var(--c,var(--accent));margin-top:2px}
.prop-t>div{display:flex;flex-direction:column;min-width:0}
.prop-k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prop-t b{font-weight:600}.prop-t small{font-size:12px;color:var(--ink-2)}.prop-t p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2)}
.prop-a{display:flex;gap:6px;align-items:center}
.mquick{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-top:1px solid var(--line);scrollbar-width:none}
.qchip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.qchip:hover:not(:disabled){border-color:var(--c,var(--accent));color:var(--ink)}.qchip:disabled{opacity:.45;cursor:default}
.minput{display:flex;gap:8px;align-items:flex-end;padding:10px 14px 14px}
.minput textarea{min-height:48px;max-height:180px;resize:none;border-radius:12px;font-size:14px}
.mside{display:flex;flex-direction:column;gap:14px;min-width:0;align-self:stretch}.mside>:last-child{flex:1}
.pfoc{font-family:var(--f-display);font-size:18px;line-height:1.3;margin-bottom:10px}
.psteps{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.pstep{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-bottom:1px solid var(--line)}
.pstep:last-child{border-bottom:0}
.pstep.done .ckl span{color:var(--muted);text-decoration:line-through}
.pmeta{display:flex;justify-content:space-between;gap:8px;padding-left:25px;font-size:11.5px}
.mems{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;margin:10px 0;scrollbar-width:thin}
.mem{background:var(--surface-2);border-radius:10px;padding:8px 10px;border:1px solid transparent}
.mem.fixo{border-color:color-mix(in srgb,var(--a-pro) 40%,transparent)}
.mem p{margin:4px 0;font-size:13px}
.mtag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mtag.t-decisao{color:var(--a-car)}.mtag.t-compromisso{color:var(--a-fis)}.mtag.t-preferencia{color:var(--a-apr)}.mtag.t-progresso{color:var(--good)}.mtag.t-ideia{color:var(--a-pro)}.mtag.t-alerta{color:var(--crit)}.mtag.t-recado{color:var(--a-men)}
.mmeta{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--muted)}.mmeta span{flex:1}.mmeta .vb{width:24px;height:24px}
.memadd{display:flex;gap:6px}
.mside .segs{width:100%;flex-wrap:wrap}

/* ---------------------------------------------------------------- dados, integrações, ajustes */
.dados{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.dslist{position:sticky;top:14px;display:flex;flex-direction:column;gap:1px;padding:8px}
.dsi{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13px}
.dsi em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.dsi:hover{background:var(--surface-2);color:var(--ink)}.dsi.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.dgrid{min-width:0}
.dt.edit td{padding:3px 4px}
.dt.edit input,.dt.edit select{border-color:transparent;background:transparent;padding:5px 6px;font-size:12.5px;min-width:90px}
.dt.edit input[type=number]{min-width:70px;text-align:right;font-family:var(--f-mono)}
.dt.edit input:hover,.dt.edit select:hover{border-color:var(--line-2)}
.dt.edit input:focus,.dt.edit select:focus{background:var(--surface);border-color:var(--accent)}
.dt.edit td.long{max-width:320px}
.chkc{width:34px;text-align:center!important}
.sortb{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;font-weight:600}
.sortb:hover{color:var(--ink)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 9%,var(--surface-2));border-radius:10px;padding:6px 8px}
.bulk select,.bulk input{width:auto;max-width:180px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.filebtn{position:relative;cursor:pointer}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.xbtn{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);text-decoration:none;transition:border-color .15s}
.xbtn:hover:not(:disabled){border-color:var(--accent)}.xbtn:disabled{opacity:.5;cursor:default}
.xbtn .ico{color:var(--accent);margin-top:2px}
.xbtn span{display:flex;flex-direction:column;min-width:0}.xbtn b{font-weight:600;font-size:13px}.xbtn small{font-size:11.5px;color:var(--muted)}
.nres{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.nres>div:first-child{min-width:0}.nres b{font-weight:600}.nres small{display:block;font-size:11.5px;color:var(--muted)}.nres p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2)}
.ntpv{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.ntpv pre{white-space:pre-wrap;font-family:var(--f-display);font-size:14px;line-height:1.55;max-height:280px;overflow:auto;margin:0;color:var(--ink-2)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:12px}
.lists label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lists textarea{font-family:var(--f-mono);font-size:12px;line-height:1.55}
.lists small{font-weight:400}

/* ---------------------------------------------------------------- responsivo */
@media (max-width:1380px){.mroom{grid-template-columns:250px minmax(0,1fr)}.mside{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}

/* ---------------------------------------------------------------- empacotamento (sem buracos) */
.packed{grid-auto-rows:4px;row-gap:0!important;grid-auto-flow:row dense;align-items:start}
.packed>*{margin-top:0!important;margin-bottom:0!important;align-self:start}
.packed>.vis.grown>.vbody:not(:has(table,.list,.agenda,.bls,.terms,.empty)){display:flex;flex-direction:column;justify-content:center}
.packed>.capped{overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}
.packed>.capped>header{position:sticky;top:-13px;z-index:2;background:var(--surface);margin-top:-13px;padding-top:13px}
.packed>.capped::after{content:"";position:sticky;display:block;bottom:-15px;height:28px;margin-top:-28px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.hjd{display:flex;flex-direction:column;gap:12px;min-width:0}
/* ---------------------------------------------------------------- diário de cada setor */
.sj{display:flex;flex-direction:column;gap:16px;min-width:0}
.sjhero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 58%),var(--surface)}
.sjhero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.sjh-t{min-width:0}.sjh-t h2{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.sjh-t h2 .ico{width:24px;height:24px;color:var(--c)}.sjh-t p{margin:0;color:var(--ink-2);font-size:13px}
.sjk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sjk .km{box-shadow:none;background:color-mix(in srgb,var(--surface-2) 80%,transparent);border-color:transparent;padding:9px 10px}.sjk .kmv{font-size:19px}
.sjh-w{min-width:0}.sjh-w .flbl{margin:0 0 6px}.sjw{display:block;width:100%;height:42px}
.sjels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sjel{align-self:stretch;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:11px;background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.sjel .ico{color:var(--c);width:17px;height:17px}
.sjel:hover{border-color:var(--line-2);border-left-color:var(--c);background:var(--surface-2)}
.sjel[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.sjel.zero{opacity:.62}.sjel.zero:hover{opacity:1}.sjel.more{border-style:dashed;border-left-style:dashed;--c:var(--muted)}
.sje-t{display:flex;flex-direction:column;min-width:0;flex:1}.sje-t b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sje-t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sjel .md{margin:0;width:26px;height:26px;font-size:10.5px}
.sjbody{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.sjside{order:2;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:14px;min-width:0}
.sjmain{display:flex;flex-direction:column;gap:14px;min-width:0;align-self:stretch}.sjmain>.emptyb:last-child{flex:1}.sjside>.pn{margin:0}
.sjfocus{border-top:3px solid var(--c)}
.sjq{font-family:var(--f-display);font-size:21px;font-style:italic;line-height:1.3;margin:2px 0 12px;color:var(--ink)}
.sjps{display:flex;flex-direction:column;gap:6px}
.sjp{text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
.sjp::before{content:"✎ ";color:var(--accent)}.sjp:hover{border-color:var(--accent);color:var(--ink)}
.sjopen{border-left:3px solid var(--c)}.sjopen .ico{color:var(--c)}.sjopen code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink-2)}
.sjsearch{max-width:none;flex:none}
@media (max-width:1280px){.sjhero{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}.sjh-w{grid-column:1/-1}}
@media (max-width:1040px){.sjbody{grid-template-columns:1fr}.sjside{order:0;position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}}
@media (max-width:760px){.sjhero{grid-template-columns:1fr;padding:16px}.sjh-t h2{font-size:25px}.sjk{grid-template-columns:repeat(2,minmax(0,1fr))}.sjels{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.sjside{grid-template-columns:1fr}}

/* ---------------------------------------------------------------- Atlas 2: captura */
.brand b .v2{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 5px;vertical-align:3px}
.capbtn{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--ink);cursor:pointer;font-weight:600}
.capbtn .ico{color:var(--accent)}.capbtn:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.capcard{border-top:3px solid var(--accent)}
.captxt{font-family:var(--f-display);font-size:17px;line-height:1.45;min-height:84px}
.caprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:8px 0}.capd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}.capd input{width:auto}
.caprow .small .ico{width:14px;height:14px;vertical-align:-3px;color:var(--accent)}
.capprev{display:flex;flex-direction:column;gap:8px}
.capis{display:flex;flex-direction:column;gap:6px}
.capi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface-2);transition:border-color .15s,opacity .15s;opacity:.62}
.capi.on{opacity:1;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.capi.bad{border-style:dashed;opacity:.7}
.capi .ckl span{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.capi .ckl .ico{width:15px;height:15px;color:var(--accent)}
.capl{font-family:var(--f-mono)!important;font-size:11.5px!important;padding:4px 8px!important;color:var(--ink-2)!important;background:var(--surface)!important}
.capfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.capex{border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px;color:var(--ink-2);font-size:13px}.capex p{margin:4px 0;font-family:var(--f-display);font-style:italic;font-size:15px}.capex .flbl{margin:0}
.capent{border-left:3px solid var(--accent);padding:2px 0 2px 12px}.capent .flbl{margin:0 0 4px}
.caph{display:flex;align-items:center;justify-content:space-between;gap:10px}.caph h3{display:flex;align-items:center;gap:8px}.caph h3 .ico{color:var(--accent);width:20px;height:20px}
@media (max-width:640px){.capi{grid-template-columns:1fr}}
/* ---------------------------------------------------------------- privacidade */
.cz-priv{display:flex;flex-wrap:wrap;gap:6px 18px}.cz-priv .chk .ico{width:14px;height:14px;color:var(--muted)}.cz-priv .chk.off{opacity:.7}
.ent.locked{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--surface-2) 10px,var(--surface-2) 20px)}.ent.locked .ent-nt{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pinb.lockb{color:var(--a-cas)}.pinb.noaib{color:var(--warn)}
.bl.locked{cursor:default}.bl.locked .blt b{display:inline-flex;align-items:center;gap:5px}
.areatgl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.atgl{position:relative;cursor:pointer}.atgl input{position:absolute;opacity:0;pointer-events:none}
.atgl>span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.atgl>span .ico{width:14px;height:14px;color:var(--c)}.atgl input:checked+span{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-color:var(--warn);color:var(--ink);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--warn) 70%,transparent)}
.atgl input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* ---------------------------------------------------------------- experimentos */
.expbar{margin:14px 0}select.auto{width:auto;max-width:100%}
.sigt td:first-child{min-width:170px;white-space:normal}.sigt{font-size:12.5px}.sigt th{white-space:nowrap}
.expc{border-top:3px solid var(--c)}.expc.sel{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent),var(--shadow)}
.expc header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}.expc h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:2px 0 0;line-height:1.2}
.exph{margin:0 0 8px;color:var(--ink-2);font-size:13px;font-style:italic}
.exptoday{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-radius:10px;padding:9px 11px;margin:6px 0 10px;border:1px solid var(--line)}
.exptoday.B{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}.exptoday.A{background:var(--surface-2)}
.exptoday .flbl{margin:0 0 2px}.exptoday b{font-size:13.5px}
.expstrip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;margin:6px 0}
.es{height:18px;border-radius:3px;background:var(--cell);font-size:10px;line-height:18px;text-align:center;color:var(--ink);font-weight:700}
.es.B{background:color-mix(in srgb,var(--accent) 55%,var(--cell))}.es.A{background:var(--cell-mid)}.es.fut{opacity:.4}.es.now{outline:2px solid var(--ink);outline-offset:1px}
.expb{fill:color-mix(in srgb,var(--accent) 10%,transparent)}.expma{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}.expmb{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4}
.expmat{fill:var(--muted)}.expmbt{fill:var(--accent)}.expda{fill:var(--muted)}.expdb{fill:var(--accent)}.expdx{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.6}
.legend i.hollow{background:none!important;border:1.5px solid var(--muted);border-radius:50%}
.expsent{font-size:14px;line-height:1.55;margin:12px 0 0}
.expmark{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;margin-bottom:10px}.emr{display:flex;align-items:center;gap:4px;font-size:12px}.emr span{flex:1;font-family:var(--f-mono);color:var(--ink-2)}
.expidea{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.expidea:last-child{border-bottom:0}.expidea div{display:flex;flex-direction:column;min-width:0}.expidea small{color:var(--muted);font-size:12px}
.lesson{padding:8px 0;border-bottom:1px solid var(--line)}.lesson:last-child{border-bottom:0}.lesson p{margin:4px 0;font-size:13px;color:var(--ink-2)}
.hjexp{display:flex;flex-direction:column;gap:2px}.hjexp+.hjexp{margin-top:10px}
/* ---------------------------------------------------------------- radar */
.ralert{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:8px;background:var(--surface)}.ralert.crit{border-left-color:var(--crit)}
.ralert p{margin:4px 0 8px;font-size:13px;color:var(--ink-2)}
.rah{display:flex;align-items:center;gap:8px}.rah .ico{color:var(--c,var(--accent));width:16px;height:16px}.rah b{flex:1;font-size:13.5px}
.rprob{font-family:var(--f-mono);font-weight:700;font-size:12px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)}
.rfb{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-left:auto}
tr.dim td{opacity:.5}
/* ---------------------------------------------------------------- fechamento semanal */
.fsweek{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fsweek div{display:flex;flex-direction:column}.fsweek .flbl{margin:0}.fsweek b{font-family:var(--f-display);font-size:20px;font-weight:500}.fsweek small{color:var(--muted);font-size:12px}
.fssteps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.fsst{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-size:12.5px}
.fsst i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cell-mid);font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700}
.fsst.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}.fsst.on i{background:var(--accent);color:var(--accent-ink)}.fsst.done i{background:color-mix(in srgb,var(--good) 40%,var(--cell-mid))}
.fsbody{min-height:120px}.fsnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.fsents{display:flex;flex-direction:column;gap:6px}.fsent{display:grid;grid-template-columns:32px minmax(0,1fr);gap:6px;align-items:center}.fsent .vb{opacity:1}.fsent.on .vb{color:var(--warn)}
.fsprio{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.fssug{display:flex;flex-wrap:wrap;gap:6px}.fssug .qchip{white-space:normal;text-align:left}.fssug small{color:var(--muted)}
